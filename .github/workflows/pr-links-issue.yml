name: pr-links-issue

# A pull request says what it belongs to (6 October 2026): `Closes #N` or
# `Part of #N` for an issue, or `No issue: <why>` for a change that needs none — a
# typo, a dependency bump. The check does not decide which; it makes the choice
# deliberate, so that from code, through its pull request, a reader can reach the
# reasons behind it (CONTRIBUTING.md). It reads only the description, so it runs on
# every pull request, documentation included, and is cheap.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  links-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The description links an issue or says why there is none
        # The body is handed over in an environment variable, never pasted into
        # the script, so text in a description cannot become a command.
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?|part of) #[0-9]+|^No issue: *[^ ]'; then
            echo "The description links an issue, or says why there is none."
          else
            echo "::error::Say what this pull request belongs to: 'Closes #N' or 'Part of #N', or a line 'No issue: <why>'. See CONTRIBUTING.md."
            exit 1
          fi
