name: pr-links-issue

# A pull request's first line says what it belongs to (6 October 2026): `Closes #N`
# or `Part of #N` for an issue (an issue of another repository as `owner/repo#N` or its
# address), or `No issue: <why>` for a change that needs none — a typo, a dependency bump. The check does not decide which; it makes the choice
# deliberate, so that from code, through its pull request, a reader can reach the
# reasons behind it (CONTRIBUTING.md). It reads only the description, so it runs on
# every pull request, documentation included, and is cheap.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  links-issue:
    # Dependabot writes its own description and cannot be told to open it with
    # `No issue:`; a dependency bump needs no issue (dependabot.yml).
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The description links an issue or says why there is none
        # The body is handed over in an environment variable, never pasted into
        # the script, so text in a description cannot become a command.
        env:
          BODY: ${{ github.event.pull_request.body }}
        # The first line that says anything, once the template's HTML comment is
        # gone: the template opens with one, above the line this checks.
        run: |
          first=$(printf '%s\n' "$BODY" | tr -d '\r' | perl -0777 -pe 's/<!--.*?-->//gs' | grep -m1 -v '^[[:space:]]*$' || true)
          if printf '%s\n' "$first" | grep -Eiq '^[[:space:]]*((close[sd]?|fix(e[sd])?|resolve[sd]?|part of):?[[:space:]]+(([[:alnum:]_.-]+/[[:alnum:]_.-]+)?#[0-9]+|https://github\.com/[[:alnum:]_.-]+/[[:alnum:]_.-]+/issues/[0-9]+)|no issue:[[:space:]]*[^[:space:]])'; then
            echo "The description links an issue, or says why there is none."
          else
            echo "::error::The first line says what this pull request belongs to: 'Closes #N', 'Part of #N', or 'No issue: <why>'. See CONTRIBUTING.md."
            exit 1
          fi
