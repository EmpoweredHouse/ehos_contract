name: Changelog

# The release procedure EHOS's repositories share: a change a user of a package can see gets a
# line under `## [Unreleased]` in that package's CHANGELOG.md, in its own pull request, or the
# description says why not, on a line `No changelog: <why>` (CONTRIBUTING.md, "Changelogs and
# releases"). A user is a host application's developer, and a package's code is what a host gets
# of it, read from the `files:` of its `mix.exs`: `lib/`, what it ships from `priv/`, the assets
# its static files are built from, its `.formatter.exs` (the engine's exports the DSL's
# `locals_without_parens`), `mix.exs`, and the engine's `docs/`, the DSL reference and rules a
# host writes contracts by, generated from the code in part. A README, LICENSE and NOTICE ship
# too, but are prose and legal text, as the changelog itself is; tests, `config/`, `dev/`,
# `sandbox/` and CI do not ship. The check does not judge the line; it makes leaving one out
# deliberate. It reads the description too, so it runs again on every edit of it, which ci.yml
# does not listen to.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions: {}

# Each edit of a description starts a run; only the last one's verdict matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      # The filter lists the pull request's files through the API, without a checkout.
      pull-requests: read
      # A changelog is read at the base and at the head, to see its Unreleased section changed.
      contents: read
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            eh_os_contract:
              - 'packages/eh_os_contract/lib/**'
              - 'packages/eh_os_contract/priv/schema/**'
              - 'packages/eh_os_contract/docs/**'
              - 'packages/eh_os_contract/.formatter.exs'
              - 'packages/eh_os_contract/mix.exs'
            eh_os_contract_changelog:
              - 'packages/eh_os_contract/CHANGELOG.md'
            eh_os_contract_auth:
              - 'packages/eh_os_contract_auth/lib/**'
              - 'packages/eh_os_contract_auth/priv/schemas/**'
              - 'packages/eh_os_contract_auth/.formatter.exs'
              - 'packages/eh_os_contract_auth/mix.exs'
            eh_os_contract_auth_changelog:
              - 'packages/eh_os_contract_auth/CHANGELOG.md'
            eh_os_contract_web:
              - 'packages/eh_os_contract_web/lib/**'
              - 'packages/eh_os_contract_web/priv/static/**'
              - 'packages/eh_os_contract_web/assets/**'
              - 'packages/eh_os_contract_web/.formatter.exs'
              - 'packages/eh_os_contract_web/mix.exs'
            eh_os_contract_web_changelog:
              - 'packages/eh_os_contract_web/CHANGELOG.md'
            eh_os_contract_graph:
              - 'packages/eh_os_contract_graph/lib/**'
              - 'packages/eh_os_contract_graph/priv/static/**'
              - 'packages/eh_os_contract_graph/assets/**'
              - 'packages/eh_os_contract_graph/.formatter.exs'
              - 'packages/eh_os_contract_graph/mix.exs'
            eh_os_contract_graph_changelog:
              - 'packages/eh_os_contract_graph/CHANGELOG.md'

      - name: A change a host can see has a line in its package's CHANGELOG.md, or says why not
        # The description is handed over in an environment variable, never pasted into the script,
        # so text in it cannot become a command; the template's HTML comments are dropped first.
        env:
          EH_OS_CONTRACT: ${{ steps.filter.outputs.eh_os_contract }}
          EH_OS_CONTRACT_CHANGELOG: ${{ steps.filter.outputs.eh_os_contract_changelog }}
          EH_OS_CONTRACT_AUTH: ${{ steps.filter.outputs.eh_os_contract_auth }}
          EH_OS_CONTRACT_AUTH_CHANGELOG: ${{ steps.filter.outputs.eh_os_contract_auth_changelog }}
          EH_OS_CONTRACT_WEB: ${{ steps.filter.outputs.eh_os_contract_web }}
          EH_OS_CONTRACT_WEB_CHANGELOG: ${{ steps.filter.outputs.eh_os_contract_web_changelog }}
          EH_OS_CONTRACT_GRAPH: ${{ steps.filter.outputs.eh_os_contract_graph }}
          EH_OS_CONTRACT_GRAPH_CHANGELOG: ${{ steps.filter.outputs.eh_os_contract_graph_changelog }}
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # A package's `## [Unreleased]` section at a commit, empty where the file is not.
          unreleased() {
            { gh api -H "Accept: application/vnd.github.raw" \
                "repos/$GITHUB_REPOSITORY/contents/packages/$1/CHANGELOG.md?ref=$2" 2>/dev/null || true; } |
              awk '/^## \[Unreleased\]/ { inside = 1; next } /^## \[/ { inside = 0 } inside'
          }
          missing=()
          # A changelog counts only when its Unreleased section changed: a line edited in an older
          # version's section is not the change's line.
          need() {
            if [ "$2" = "true" ] && { [ "$3" != "true" ] ||
                [ "$(unreleased "$1" "$BASE")" = "$(unreleased "$1" "$HEAD")" ]; }; then
              missing+=("$1")
            fi
          }
          need eh_os_contract "$EH_OS_CONTRACT" "$EH_OS_CONTRACT_CHANGELOG"
          need eh_os_contract_auth "$EH_OS_CONTRACT_AUTH" "$EH_OS_CONTRACT_AUTH_CHANGELOG"
          need eh_os_contract_web "$EH_OS_CONTRACT_WEB" "$EH_OS_CONTRACT_WEB_CHANGELOG"
          need eh_os_contract_graph "$EH_OS_CONTRACT_GRAPH" "$EH_OS_CONTRACT_GRAPH_CHANGELOG"

          if [ "${#missing[@]}" -eq 0 ]; then
            echo "Every package whose code changes has a line in its CHANGELOG.md, or none changes."
          elif printf '%s\n' "$BODY" | tr -d '\r' | perl -0777 -pe 's/<!--.*?-->//gs' | grep -Eiq '^[[:space:]]*no changelog:[[:space:]]*[^[:space:]]'; then
            echo "The description says why these packages have no line in their CHANGELOG.md: ${missing[*]}."
          else
            for package in "${missing[@]}"; do
              echo "::error::packages/$package changes what a host sees, and packages/$package/CHANGELOG.md has no line for it."
            done
            echo "::error::Add a line under '## [Unreleased]' in each of these packages' CHANGELOG.md (${missing[*]}), or say why not on a line 'No changelog: <why>' in the description. See CONTRIBUTING.md, 'Changelogs and releases'."
            exit 1
          fi
