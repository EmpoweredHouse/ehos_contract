name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.18.4"

      # Same file a developer runs locally (CLAUDE.md's documented gate) —
      # one Postgres definition, not a second one duplicated into this
      # workflow that could drift from docker-compose.yml over time.
      # `--wait` blocks on the healthcheck already declared there, so
      # nothing here needs its own retry loop.
      - name: Start Postgres
        run: docker compose up -d --wait

      # The sandbox is the host application around the library — TaxVision,
      # Rehmed, a Phoenix endpoint — and its `mix check` is the gate: it runs its
      # own suite and then each package's `mix check` as a separate project.
      - name: Cache sandbox deps
        uses: actions/cache@v4
        with:
          path: sandbox/deps
          key: sandbox-deps-${{ runner.os }}-${{ hashFiles('sandbox/mix.lock') }}

      # The engine is a path dependency, but package_test/1 in sandbox/mix.exs runs
      # `mix check` with `cd: "packages/eh_os_contract"` as a fully separate Mix
      # project — its own deps/ and mix.lock, fetched independently of the
      # host's. Confirmed 21 August 2026: packages/eh_os_contract/deps is
      # git-ignored, so a fresh checkout starts without it.
      - name: Cache engine deps
        uses: actions/cache@v4
        with:
          path: packages/eh_os_contract/deps
          key: eh-os-contract-core-deps-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract/mix.lock') }}

      # The dashboard foundation (PLAN.md, dopisek 23 sierpnia), same shape
      # as the engine above: a path dependency whose own gate runs as a
      # fully separate Mix project via package_test_web/1 in sandbox/mix.exs.
      - name: Cache dashboard foundation deps
        uses: actions/cache@v4
        with:
          path: packages/eh_os_contract_web/deps
          key: eh-os-contract-web-deps-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_web/mix.lock') }}

      # The credential verifier (v2 stage EA), same shape: its gate runs as a
      # separate Mix project via package_test_auth/1 in sandbox/mix.exs.
      - name: Cache credential verifier deps
        uses: actions/cache@v4
        with:
          path: packages/eh_os_contract_auth/deps
          key: eh-os-contract-auth-deps-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_auth/mix.lock') }}

      - name: Install sandbox deps
        working-directory: sandbox
        run: mix deps.get

      - name: Install engine deps
        working-directory: packages/eh_os_contract
        run: mix deps.get

      - name: Install dashboard foundation deps
        working-directory: packages/eh_os_contract_web
        run: mix deps.get

      - name: Install credential verifier deps
        working-directory: packages/eh_os_contract_auth
        run: mix deps.get

      # No `mix ecto.setup` before this: `mix check` runs under MIX_ENV=test
      # (`cli/0`'s `preferred_envs`), and both the host's and the engine's own
      # `test:` alias already create and migrate their test databases before
      # running. Confirmed 21 August 2026 by dropping the dev database and
      # running the gate anyway — it still passed. `ecto.setup` in the
      # documented local command is for a working dev database to poke at
      # afterward, not a precondition of the gate itself.
      #
      # A fresh `_build` here, always — which matters for one step in particular.
      # Mix caches the resolved formatter configuration and does not invalidate it
      # when a dependency's `.formatter.exs` changes, so a developer's machine can
      # disagree with this job about `format --check-formatted`. CI is the one that
      # is right; the local fix is to delete
      # `_build/<env>/lib/<app>/.mix/cached_dot_formatter`.
      - name: mix check
        working-directory: sandbox
        run: mix check
