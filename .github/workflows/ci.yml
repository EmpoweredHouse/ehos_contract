name: check

# Pull requests, not every push to `main`: that run checked a second time the
# code its pull request had just passed — a third of all runs (5 October 2026).
# `main` still runs when a lock file or this workflow changes, and once a week,
# because a pull request restores caches only from its own branch and from
# `main`: without a run there, and once GitHub evicts an entry unused for seven
# days, every new pull request would compile its dependencies cold. The price is
# that nothing checks `main` after a merge — two pull requests that each pass
# can still break it together, and the first to see it is the next pull request.
# `workflow_dispatch` runs the gate on any branch by hand.
on:
  push:
    branches: [main]
    paths:
      - "sandbox/mix.lock"
      - "packages/*/mix.lock"
      - ".github/workflows/ci.yml"
  schedule:
    - cron: "0 4 * * 1"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Changes that touch only the team's working documents skip the gate. The
    # order matters: `!docs/**` drops the directory and the last line takes back
    # the one file under it that a test reads — contract_examples_test.exs
    # compiles the examples in docs/adr/contract-v2.md. Anything a test or a
    # `--check` task reads elsewhere (packages/*/docs, packages/*/README.md) is
    # not excluded.
    paths:
      - "**"
      - "!ROADMAP.md"
      - "!CLAUDE.md"
      - "!README.md"
      - "!docs/**"
      - "docs/adr/contract-v2.md"
  workflow_dispatch:

# The job runs the branch's own code, so its token can read and nothing more.
permissions:
  contents: read

# A new push to the same pull request cancels the run still checking the old one.
# A run on `main` is never cancelled: it is the one that saves the caches.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # A draft is not checked until it is marked ready for review; on a push
    # there is no pull request and the condition holds.
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    # The oldest Elixir and OTP the packages support and the newest released. The
    # floor is Elixir 1.18 (each `mix.exs`) and OTP 27, which `oidcc` in the credential
    # verifier needs. Code is formatted as the oldest pair formats it: the newest
    # formats a few lines differently. On a pull request the newest also runs the suite
    # on the newest Spark the engine's range admits.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: oldest
            otp: "27.2"
            elixir: "1.18.4"
          - name: newest
            otp: "29"
            elixir: "1.20"
    name: check (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      # Same file a developer runs locally (CLAUDE.md's documented gate) —
      # one Postgres definition, not a second one duplicated into this
      # workflow that could drift from docker-compose.yml over time.
      # `--wait` blocks on the healthcheck already declared there, so
      # nothing here needs its own retry loop.
      - name: Start Postgres
        run: docker compose up -d --wait

      # The sandbox is the host application around the library — its case
      # studies and a Phoenix endpoint — and its `mix check` is the gate: it runs its
      # own suite and then each package's `mix check` as a separate project.
      - name: Cache sandbox deps
        uses: actions/cache@v4
        with:
          path: sandbox/deps
          key: sandbox-deps-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('sandbox/mix.lock') }}

      # The engine is a path dependency, but package_test/1 in sandbox/mix.exs runs
      # `mix check` with `cd: "packages/eh_os_contract"` as a fully separate Mix
      # project — its own deps/ and mix.lock, fetched independently of the
      # host's. Confirmed 21 August 2026: packages/eh_os_contract/deps is
      # git-ignored, so a fresh checkout starts without it.
      - name: Cache engine deps
        uses: actions/cache@v4
        with:
          path: packages/eh_os_contract/deps
          key: eh-os-contract-core-deps-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract/mix.lock') }}

      # The dashboard package, same shape
      # as the engine above: a path dependency whose own gate runs as a
      # fully separate Mix project via package_test_web/1 in sandbox/mix.exs.
      - name: Cache dashboard foundation deps
        uses: actions/cache@v4
        with:
          path: packages/eh_os_contract_web/deps
          key: eh-os-contract-web-deps-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_web/mix.lock') }}

      # The credential verifier (v2 stage EA), same shape: its gate runs as a
      # separate Mix project via package_test_auth/1 in sandbox/mix.exs.
      - name: Cache credential verifier deps
        uses: actions/cache@v4
        with:
          path: packages/eh_os_contract_auth/deps
          key: eh-os-contract-auth-deps-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_auth/mix.lock') }}

      # The graph renderer (plan E13b), same shape: its gate runs as a separate Mix
      # project via package_test_graph/1 in sandbox/mix.exs.
      - name: Cache graph renderer deps
        uses: actions/cache@v4
        with:
          path: packages/eh_os_contract_graph/deps
          key: eh-os-contract-graph-deps-${{ matrix.name }}-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_graph/mix.lock') }}

      # Compiled dependencies, one cache per project. Without it every run
      # compiled ecto, postgrex, oban, plug and the rest from scratch four times
      # over — about three and a half of the five minutes `mix check` took. The
      # key carries everything a compiled dependency depends on: the runner
      # image, the toolchain, the lock files and the configuration, which can
      # set a dependency's compile-time values. There are no `restore-keys` on
      # purpose: after a lock change Mix recompiles the dependency that moved
      # but not the ones built against its macros, so a partial hit could pass
      # or fail where a clean build would not. A lock change compiles cold once.
      #
      # The repository's own applications — everything named eh_os_contract*,
      # which the sandbox and the packages also build as path dependencies — and
      # the consolidated protocols are left out of the cache, and deleted after
      # the restore in case an entry saved before that exclusion still holds
      # them, so they are always compiled fresh, exactly as before. That keeps the
      # formatter-cache caveat at the `mix check` step below true: `_build` holds
      # nothing of the repository's own between runs.
      # `ImageOS` (ubuntu24, …) is in the runner's environment, which the `env`
      # context does not see.
      - name: Name the runner image
        id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache compiled deps
        uses: actions/cache@v4
        with:
          path: |
            sandbox/_build
            packages/eh_os_contract/_build
            packages/eh_os_contract_web/_build
            packages/eh_os_contract_auth/_build
            packages/eh_os_contract_graph/_build
            !sandbox/_build/*/lib/eh_os_contract*
            !packages/*/_build/*/lib/eh_os_contract*
            !sandbox/_build/*/consolidated
            !packages/*/_build/*/consolidated
            !packages/*/_build/*/doc
          key: build-${{ steps.image.outputs.os }}-otp${{ steps.beam.outputs.otp-version }}-ex${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('sandbox/mix.lock', 'packages/*/mix.lock', 'sandbox/config/**', 'packages/*/config/**') }}

      - name: Drop the repository's own compiled applications
        run: |
          rm -rf sandbox/_build/*/lib/eh_os_contract* sandbox/_build/*/consolidated
          rm -rf packages/*/_build/*/lib/eh_os_contract* packages/*/_build/*/consolidated

      - name: Install sandbox deps
        working-directory: sandbox
        run: mix deps.get

      - name: Install engine deps
        working-directory: packages/eh_os_contract
        run: mix deps.get

      # `--only test`: the dashboard's `:dev` dependency, ehos_design, lives in the
      # private EmpoweredHouse/ehos-tools, which this job has no credentials for. Only
      # `mix assets.build` reads it, and its output is committed, so the gate never needs it.
      - name: Install dashboard foundation deps
        working-directory: packages/eh_os_contract_web
        run: mix deps.get --only test

      - name: Install credential verifier deps
        working-directory: packages/eh_os_contract_auth
        run: mix deps.get

      - name: Install graph renderer deps
        working-directory: packages/eh_os_contract_graph
        run: mix deps.get

      # The newest pair only. The repository follows the oldest pair's formatter, so the
      # newest formats first. Nothing here is committed.
      - name: Format as the newest Elixir does
        if: ${{ matrix.name == 'newest' }}
        # The environment the dependencies were fetched for: in `:dev` the dashboard
        # would also ask for its private `:dev` dependency.
        env:
          MIX_ENV: test
        run: |
          for project in sandbox packages/*/; do
            (cd "$project" && mix format)
          done

      # The newest Spark the engine's range lets a host resolve, which no lock holds.
      # Only on a pull request: an unlocked dependency runs its code during the build,
      # and a pull request's caches stay in its own scope, where `main`'s, which every
      # pull request restores, would not; `main`'s caches keep matching their keys.
      - name: Take the newest Spark the engine admits
        if: ${{ matrix.name == 'newest' && github.event_name == 'pull_request' }}
        env:
          MIX_ENV: test
        run: |
          for project in sandbox packages/*/; do
            if grep -q '"spark"' "$project/mix.lock"; then
              (cd "$project" && mix deps.update spark --only test)
            fi
          done

      # No `mix ecto.setup` before this: `mix check` runs under MIX_ENV=test
      # (`cli/0`'s `preferred_envs`), and both the host's and the engine's own
      # `test:` alias already create and migrate their test databases before
      # running. Confirmed 21 August 2026 by dropping the dev database and
      # running the gate anyway — it still passed. `ecto.setup` in the
      # documented local command is for a working dev database to poke at
      # afterward, not a precondition of the gate itself.
      #
      # A fresh build of the repository's own code here, always (dependencies
      # come compiled from the cache above) — which matters for one step in particular.
      # Mix caches the resolved formatter configuration and does not invalidate it
      # when a dependency's `.formatter.exs` changes, so a developer's machine can
      # disagree with this job about `format --check-formatted`. CI is the one that
      # is right; the local fix is to delete
      # `_build/<env>/lib/<app>/.mix/cached_dot_formatter`.
      - name: mix check
        working-directory: sandbox
        run: mix check

  # Each package as Hex would build it, and as an application would read it once
  # installed: `mix hex.build` refuses a dependency that is not a Hex package and a
  # file `files:` names that is missing, and hex-package-deps.exs reads the unpacked
  # `mix.exs` beside the engine it would find in an application's deps/. Nothing is
  # compiled or fetched: hex.build reads only the project's configuration.
  hex-build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.2"
          elixir-version: "1.18.4"

      - name: Build and read each package
        env:
          EH_OS_CONTRACT_HEX: "1"
        run: |
          out="$RUNNER_TEMP/hex"
          for package in packages/*/; do
            package=$(basename "$package")
            (cd "packages/$package" && mix hex.build --unpack --output "$out/$package")
            (cd "$out" && env -u EH_OS_CONTRACT_HEX elixir "$GITHUB_WORKSPACE/.github/scripts/hex-package-deps.exs" "$out/$package")
          done
