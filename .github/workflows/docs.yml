name: docs

# The documentation of the four packages, as a file to download: ExDoc's HTML, the
# Markdown it is made from, and an index (.github/scripts/build-docs.sh). Nothing is
# published: a GitHub Pages site of this private repository would be public on its
# plan, so the docs stay where the code is (#201, #237).
#
# By hand, for any branch, tag or full commit SHA: Actions → docs → Run workflow; or
# `gh workflow run docs.yml -f ref=<ref>`. The archive is the run's artifact, kept
# 30 days. On a published release it is also attached to the release, and kept with it;
# so it is when run by hand on a tag that has a release, which is how release.yml's
# Publish job has it built, since a release created with GITHUB_TOKEN starts no workflow.
# The build script is the checked-out ref's, so a ref from before #237 cannot be built.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or full 40-character commit SHA to build the documentation of
        required: true
        default: main
  release:
    types: [published]

# The build reads; only the job that attaches the archive to a release writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.name.outputs.name }}
      release: ${{ steps.ref.outputs.release }}

    steps:
      # Before anything reads it: a ref is text a person typed, so it reaches the
      # scripts through the environment, never written into one, and is refused unless
      # it is a branch's, tag's or commit's name. A release builds its tag as a tag, so
      # a branch of the same name cannot stand in for it; so does a run by hand on a tag
      # that has a release, whose archive is then attached to it.
      - name: Check the ref
        id: ref
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="${TAG:-$INPUT}"
          if [[ ! "$ref" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ || "$ref" == *..* ]]; then
            echo "'$ref' is not a branch, tag or commit name" >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # A tag with a release, asked of the API: "no such release" (HTTP 404) is a plain
          # build, any other answer stops the run rather than leave a release without its docs.
          release="$TAG"
          if [[ -z "$release" ]]; then
            if found=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$INPUT" --jq .tag_name 2> "$RUNNER_TEMP/release.err"); then
              if [[ "$found" == "$INPUT" ]]; then release="$INPUT"; fi
            elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release.err"; then
              cat "$RUNNER_TEMP/release.err" >&2
              echo "Could not tell whether '$INPUT' has a release" >&2
              exit 1
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          if [[ -n "$release" ]]; then
            echo "checkout=refs/tags/$release" >> "$GITHUB_OUTPUT"
          else
            echo "checkout=$INPUT" >> "$GITHUB_OUTPUT"
          fi

      # No token is left in .git/config: the dependencies' code runs while they compile,
      # and nothing after the checkout needs git to authenticate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.checkout }}
          persist-credentials: false

      - name: Name the archive
        id: name
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: echo "name=eh-os-contract-docs-${REF//\//-}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: "27.2"
          elixir-version: "1.18.4"

      # Restored, never saved. A run by hand executes this file from one branch and
      # fetches the dependencies of another ref; saving them would put that ref's
      # dependencies into the branch's cache, `main`'s included, where ci.yml's gate
      # would restore them. ci.yml saves these keys; this only reads them. Each key and
      # `path` is copied from ci.yml's: actions/cache finds an entry by its key and by its
      # `path` text, so a key or a path that differs by a character never restores
      # anything. Fetched sources do not depend on the toolchain, so either matrix entry
      # would do; `oldest` is the pair this job also runs. The engine's entry holds no code
      # of the private ehos-tools (`ehos_*`), as ci.yml saves it, and an older entry saved
      # with another `path` text cannot match this one. A run also reads the entries of the
      # branch or tag it runs on, which only workflows running that ref's own files save:
      # whoever could save one there could change this file there too.
      - name: Restore engine deps
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/eh_os_contract/deps/*
            !packages/eh_os_contract/deps/ehos_*
          key: eh-os-contract-core-deps-oldest-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract/mix.lock') }}

      - name: Restore dashboard foundation deps
        uses: actions/cache/restore@v4
        with:
          path: packages/eh_os_contract_web/deps
          key: eh-os-contract-web-deps-oldest-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_web/mix.lock') }}

      - name: Restore credential verifier deps
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/eh_os_contract_auth/deps/*
            !packages/eh_os_contract_auth/deps/ehos_*
          key: eh-os-contract-auth-deps-oldest-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_auth/mix.lock') }}

      - name: Restore graph renderer deps
        uses: actions/cache/restore@v4
        with:
          path: |
            packages/eh_os_contract_graph/deps/*
            !packages/eh_os_contract_graph/deps/ehos_*
          key: eh-os-contract-graph-deps-oldest-${{ runner.os }}-${{ hashFiles('packages/eh_os_contract_graph/mix.lock') }}

      # `--only test`, as in ci.yml: the engine's `:dev` dependencies, which draw its
      # diagrams and which `mix docs` does not need, live in the private ehos-tools, and this
      # job has no credentials for it.
      - name: Install engine deps
        working-directory: packages/eh_os_contract
        run: mix deps.get --only test

      # `--only test`, as in ci.yml: the dashboard's `:dev` dependency is in a private
      # repository this job has no credentials for, and the docs build under MIX_ENV=test.
      - name: Install dashboard foundation deps
        working-directory: packages/eh_os_contract_web
        run: mix deps.get --only test

      # `--only test`, as for the engine: the verifier's `:dev` dependencies draw its diagrams.
      - name: Install credential verifier deps
        working-directory: packages/eh_os_contract_auth
        run: mix deps.get --only test

      # `--only test`, as for the engine: the renderer's `:dev` dependencies draw its diagrams.
      - name: Install graph renderer deps
        working-directory: packages/eh_os_contract_graph
        run: mix deps.get --only test

      - name: Build the documentation
        env:
          REF: ${{ steps.ref.outputs.ref }}
        run: .github/scripts/build-docs.sh "$RUNNER_TEMP/docs" "$REF"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ runner.temp }}/docs
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  attach:
    if: needs.build.outputs.release != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: docs

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.build.outputs.name }}
          TAG: ${{ needs.build.outputs.release }}
        run: |
          (cd docs && zip -qr "../$NAME.zip" .)
          gh release upload --clobber --repo "$GITHUB_REPOSITORY" -- "$TAG" "$NAME.zip"
