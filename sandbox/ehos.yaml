# Test data for the manifest task, not a deployment: the sandbox is the library's first consumer,
# and nobody deploys it. It holds several domains, so it must name the one an image would be:
# `billing`, the one that publishes. The format is EHOS's (eh-os D-51, docs/ehos-yaml.md).
schema: ehos.yaml/v1
application: billing
serves:
  - name: web
    port: 4010
health:
  port: 4011
  ready: /health/ready
  live: /health/live
