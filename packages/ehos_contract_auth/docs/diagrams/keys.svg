<!-- title: Where do the keys come from? -->
<!-- desc: EHOS issues each credential; the key process fetches the public keys of EHOS over HTTPS and keeps them, and verify/2 checks each credential against them. -->
<!-- words: application, credential -->
<!-- technical: EHOS, Caller, Key process, Key table, EhosContract.Auth.Keys, ehos_contract_auth_keys, verify/2 -->
<!-- verbs: issues, fetches, writes, loads, sends, checks -->
<!-- parts: ehos = -, process = -, table = -, caller = -, verify = - -->
<svg viewBox="0 0 1000 492" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="keys-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Connectors, drawn before the parts -->
  <line class="arr" x1="200" y1="120" x2="200" y2="223" marker-end="url(#keys-arrow)"/>
  <line class="arr" x1="410" y1="92" x2="291" y2="92" marker-end="url(#keys-arrow)"/>
  <line class="arr" x1="590" y1="84" x2="709" y2="84" marker-end="url(#keys-arrow)"/>
  <line class="arr" x1="290" y1="252" x2="409" y2="252" marker-end="url(#keys-arrow)"/>
  <line class="arr" x1="500" y1="224" x2="500" y2="121" marker-end="url(#keys-arrow)"/>
  <line class="arr" x1="590" y1="104" x2="709" y2="104" marker-end="url(#keys-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="212" y="164" width="72" height="14" rx="2"/>
  <circle class="badge" cx="222" cy="171" r="6"/>
  <text class="badget" x="222" y="174" text-anchor="middle">1</text>
  <text class="lbl" x="234" y="174">ISSUES</text>

  <rect class="mask" x="304" y="70" width="80" height="14" rx="2"/>
  <circle class="badge" cx="314" cy="77" r="6"/>
  <text class="badget" x="314" y="80" text-anchor="middle">2</text>
  <text class="lbl" x="326" y="80">FETCHES</text>

  <rect class="mask" x="604" y="62" width="72" height="14" rx="2"/>
  <circle class="badge" cx="614" cy="69" r="6"/>
  <text class="badget" x="614" y="72" text-anchor="middle">3</text>
  <text class="lbl" x="626" y="72">WRITES</text>

  <rect class="mask" x="604" y="112" width="64" height="14" rx="2"/>
  <circle class="badge" cx="614" cy="119" r="6"/>
  <text class="badget" x="614" y="122" text-anchor="middle">4</text>
  <text class="lbl" x="626" y="122">LOADS</text>

  <rect class="mask" x="304" y="230" width="64" height="14" rx="2"/>
  <circle class="badge" cx="314" cy="237" r="6"/>
  <text class="badget" x="314" y="240" text-anchor="middle">5</text>
  <text class="lbl" x="326" y="240">SENDS</text>

  <rect class="mask" x="512" y="164" width="72" height="14" rx="2"/>
  <circle class="badge" cx="522" cy="171" r="6"/>
  <text class="badget" x="522" y="174" text-anchor="middle">6</text>
  <text class="lbl" x="534" y="174">CHECKS</text>

  <!-- Parts -->
  <rect class="knock" x="110" y="64" width="180" height="56" rx="6"/>
  <rect id="keys-ehos" class="n-ext" x="110" y="64" width="180" height="56" rx="6"/>
  <text class="name" x="200" y="88" text-anchor="middle">EHOS</text>
  <text class="sub" x="200" y="106" text-anchor="middle">signs with its private key</text>

  <rect class="knock" x="410" y="64" width="180" height="56" rx="6"/>
  <rect id="keys-process" class="n-focal" x="410" y="64" width="180" height="56" rx="6"/>
  <text class="name" x="500" y="88" text-anchor="middle">Key process</text>
  <text class="sub" x="500" y="106" text-anchor="middle">EhosContract.Auth.Keys</text>

  <rect class="knock" x="710" y="64" width="180" height="56" rx="6"/>
  <rect id="keys-table" class="n-store" x="710" y="64" width="180" height="56" rx="6"/>
  <text class="name" x="800" y="88" text-anchor="middle">Key table</text>
  <text class="sub" x="800" y="106" text-anchor="middle">ehos_contract_auth_keys</text>

  <rect class="knock" x="110" y="224" width="180" height="56" rx="6"/>
  <rect id="keys-caller" class="n-ext" x="110" y="224" width="180" height="56" rx="6"/>
  <text class="name" x="200" y="248" text-anchor="middle">Caller</text>
  <text class="sub" x="200" y="266" text-anchor="middle">with a credential</text>

  <rect class="knock" x="410" y="224" width="180" height="56" rx="6"/>
  <rect id="keys-verify" class="n-back" x="410" y="224" width="180" height="56" rx="6"/>
  <text class="name" x="500" y="248" text-anchor="middle">verify/2</text>
  <text class="sub" x="500" y="266" text-anchor="middle">in the application</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="320" x2="960" y2="320"/>
  <text class="eyes" x="40" y="340">HOW TO READ IT</text>
  <circle class="badge" cx="46" cy="360" r="6"/>
  <text class="badget" x="46" y="363" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="364">EHOS issues a credential, signed with its private key.</text>
  <circle class="badge" cx="46" cy="384" r="6"/>
  <text class="badget" x="46" y="387" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="388">The key process fetches the public keys over HTTPS.</text>
  <circle class="badge" cx="46" cy="408" r="6"/>
  <text class="badget" x="46" y="411" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="412">The key process writes the keys to its table.</text>
  <circle class="badge" cx="526" cy="360" r="6"/>
  <text class="badget" x="526" y="363" text-anchor="middle">4</text>
  <text class="keyt" x="540" y="364">At start, the key process loads the last keys from its table.</text>
  <circle class="badge" cx="526" cy="384" r="6"/>
  <text class="badget" x="526" y="387" text-anchor="middle">5</text>
  <text class="keyt" x="540" y="388">The caller sends the credential to the application.</text>
  <circle class="badge" cx="526" cy="408" r="6"/>
  <text class="badget" x="526" y="411" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="412">verify/2 checks the signature against a key in memory.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="448" x2="960" y2="448"/>
  <rect class="n-focal" x="40" y="464" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="473">The key process</text>
  <rect class="n-back" x="180" y="464" width="14" height="10" rx="2"/>
  <text class="legt" x="200" y="473">In the application</text>
  <rect class="n-ext" x="340" y="464" width="14" height="10" rx="2"/>
  <text class="legt" x="360" y="473">Outside the application</text>
  <rect class="n-store" x="540" y="464" width="14" height="10" rx="2"/>
  <text class="legt" x="560" y="473">Kept by the application</text>
  <line class="arr" x1="740" y1="469" x2="767" y2="469" marker-end="url(#keys-arrow)"/>
  <text class="legt" x="776" y="473">A request, a call or a read</text>
  </g>
</svg>
