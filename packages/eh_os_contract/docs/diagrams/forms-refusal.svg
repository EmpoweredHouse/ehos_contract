<!-- title: What occurs from a keystroke to a refusal? -->
<!-- desc: The form checks each field as the person types; the implementation rejects on an invariant of the unit, and the form shows that refusal. -->
<!-- words: actor, value, dispatch, implementation -->
<!-- technical: LiveView, Form -->
<!-- verbs: types, builds, asks, shows, submits, dispatches, rejects, returns, puts -->
<!-- parts: actor = -, liveview = -, form = -, value = -, dispatch = -, implementation = - -->
<svg viewBox="0 0 1000 816" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="forms-refusal-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- The two moments of the form -->
  <rect class="zone" x="40" y="140" width="920" height="168" rx="8"/>
  <rect class="mask" x="56" y="134" width="164" height="12" rx="2"/>
  <text class="zlabel" x="60" y="143">WHILE THE PERSON TYPES</text>
  <rect class="zone" x="40" y="320" width="920" height="248" rx="8"/>
  <rect class="mask" x="56" y="314" width="176" height="12" rx="2"/>
  <text class="zlabel" x="60" y="323">WHEN THE PERSON SUBMITS</text>

  <!-- Lifelines -->
  <line class="rule" x1="100" y1="120" x2="100" y2="580"/>
  <line class="rule" x1="260" y1="120" x2="260" y2="580"/>
  <line class="rule" x1="420" y1="120" x2="420" y2="580"/>
  <line class="rule" x1="580" y1="120" x2="580" y2="580"/>
  <line class="rule" x1="740" y1="120" x2="740" y2="580"/>
  <line class="rule" x1="900" y1="120" x2="900" y2="580"/>

  <!-- Messages, top to bottom -->
  <line class="arr" x1="100" y1="176" x2="259" y2="176" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="260" y1="212" x2="419" y2="212" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="420" y1="248" x2="579" y2="248" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="260" y1="284" x2="101" y2="284" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="100" y1="356" x2="259" y2="356" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="260" y1="392" x2="739" y2="392" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="900" y1="428" x2="741" y2="428" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="740" y1="464" x2="261" y2="464" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="260" y1="500" x2="419" y2="500" marker-end="url(#forms-refusal-arrow)"/>
  <line class="arr" x1="260" y1="536" x2="101" y2="536" marker-end="url(#forms-refusal-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="112" y="154" width="60" height="14" rx="2"/>
  <circle class="badge" cx="122" cy="161" r="6"/>
  <text class="badget" x="122" y="164" text-anchor="middle">1</text>
  <text class="lbl" x="134" y="164">TYPES</text>

  <rect class="mask" x="272" y="190" width="64" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="197" r="6"/>
  <text class="badget" x="282" y="200" text-anchor="middle">2</text>
  <text class="lbl" x="294" y="200">BUILDS</text>

  <rect class="mask" x="432" y="226" width="56" height="14" rx="2"/>
  <circle class="badge" cx="442" cy="233" r="6"/>
  <text class="badget" x="442" y="236" text-anchor="middle">3</text>
  <text class="lbl" x="454" y="236">ASKS</text>

  <rect class="mask" x="168" y="262" width="60" height="14" rx="2"/>
  <circle class="badge" cx="178" cy="269" r="6"/>
  <text class="badget" x="178" y="272" text-anchor="middle">4</text>
  <text class="lbl" x="190" y="272">SHOWS</text>

  <rect class="mask" x="112" y="334" width="72" height="14" rx="2"/>
  <circle class="badge" cx="122" cy="341" r="6"/>
  <text class="badget" x="122" y="344" text-anchor="middle">5</text>
  <text class="lbl" x="134" y="344">SUBMITS</text>

  <rect class="mask" x="272" y="370" width="88" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="377" r="6"/>
  <text class="badget" x="282" y="380" text-anchor="middle">6</text>
  <text class="lbl" x="294" y="380">DISPATCHES</text>

  <rect class="mask" x="808" y="406" width="72" height="14" rx="2"/>
  <circle class="badge" cx="818" cy="413" r="6"/>
  <text class="badget" x="818" y="416" text-anchor="middle">7</text>
  <text class="lbl" x="830" y="416">REJECTS</text>

  <rect class="mask" x="648" y="442" width="76" height="14" rx="2"/>
  <circle class="badge" cx="658" cy="449" r="6"/>
  <text class="badget" x="658" y="452" text-anchor="middle">8</text>
  <text class="lbl" x="670" y="452">RETURNS</text>

  <rect class="mask" x="272" y="478" width="52" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="485" r="6"/>
  <text class="badget" x="282" y="488" text-anchor="middle">9</text>
  <text class="lbl" x="294" y="488">PUTS</text>

  <rect class="mask" x="164" y="514" width="68" height="14" rx="2"/>
  <circle class="badge" cx="176" cy="521" r="8"/>
  <text class="badget" x="176" y="524" text-anchor="middle">10</text>
  <text class="lbl" x="192" y="524">SHOWS</text>

  <!-- The actor -->
  <rect class="knock" x="36" y="64" width="128" height="56" rx="6"/>
  <rect id="forms-refusal-actor" class="n-ext" x="36" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="100" y="88" text-anchor="middle">Actor</text>
  <text class="sub" x="100" y="106" text-anchor="middle">the person</text>

  <!-- The LiveView -->
  <rect class="knock" x="196" y="64" width="128" height="56" rx="6"/>
  <rect id="forms-refusal-liveview" class="n-focal" x="196" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="260" y="88" text-anchor="middle">LiveView</text>
  <text class="sub" x="260" y="106" text-anchor="middle">your page</text>

  <!-- The form -->
  <rect class="knock" x="356" y="64" width="128" height="56" rx="6"/>
  <rect id="forms-refusal-form" class="n-back" x="356" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="420" y="88" text-anchor="middle">Form</text>
  <text class="sub" x="420" y="106" text-anchor="middle">EhOsContract.Form</text>

  <!-- The value module -->
  <rect class="knock" x="516" y="64" width="128" height="56" rx="6"/>
  <rect id="forms-refusal-value" class="n-back" x="516" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="580" y="88" text-anchor="middle">Value module</text>
  <text class="sub" x="580" y="106" text-anchor="middle">your module</text>

  <!-- Dispatch -->
  <rect class="knock" x="676" y="64" width="128" height="56" rx="6"/>
  <rect id="forms-refusal-dispatch" class="n-back" x="676" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="740" y="88" text-anchor="middle">Dispatch</text>
  <text class="sub" x="740" y="106" text-anchor="middle">dispatch/3</text>

  <!-- The implementation -->
  <rect class="knock" x="836" y="64" width="128" height="56" rx="6"/>
  <rect id="forms-refusal-implementation" class="n-back" x="836" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="900" y="88" text-anchor="middle">Implementation</text>
  <text class="sub" x="900" y="106" text-anchor="middle">your module</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="612" x2="960" y2="612"/>
  <text class="eyes" x="40" y="632">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="652" r="6"/>
  <text class="badget" x="46" y="655" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="656">The person types in a field.</text>
  <circle class="badge" cx="46" cy="676" r="6"/>
  <text class="badget" x="46" y="679" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="680">The LiveView builds the changeset.</text>
  <circle class="badge" cx="46" cy="700" r="6"/>
  <text class="badget" x="46" y="703" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="704">The form asks for the invariants of each value.</text>
  <circle class="badge" cx="46" cy="724" r="6"/>
  <text class="badget" x="46" y="727" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="728">The LiveView shows the errors at their fields.</text>
  <circle class="badge" cx="46" cy="748" r="6"/>
  <text class="badget" x="46" y="751" text-anchor="middle">5</text>
  <text class="keyt" x="60" y="752">The person submits the form.</text>

  <circle class="badge" cx="526" cy="652" r="6"/>
  <text class="badget" x="526" y="655" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="656">The LiveView dispatches the command.</text>
  <circle class="badge" cx="526" cy="676" r="6"/>
  <text class="badget" x="526" y="679" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="680">The implementation rejects it on an invariant of the unit.</text>
  <circle class="badge" cx="526" cy="700" r="6"/>
  <text class="badget" x="526" y="703" text-anchor="middle">8</text>
  <text class="keyt" x="540" y="704">Dispatch returns the rejection.</text>
  <circle class="badge" cx="526" cy="724" r="6"/>
  <text class="badget" x="526" y="727" text-anchor="middle">9</text>
  <text class="keyt" x="540" y="728">The LiveView puts the rejection on the changeset.</text>
  <circle class="badge" cx="526" cy="748" r="8"/>
  <text class="badget" x="526" y="751" text-anchor="middle">10</text>
  <text class="keyt" x="540" y="752">The LiveView shows the rejection.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="776" x2="960" y2="776"/>
  <rect class="n-focal" x="40" y="792" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="801">Your page</text>
  <rect class="n-back" x="150" y="792" width="14" height="10" rx="2"/>
  <text class="legt" x="170" y="801">Code of the engine or of your application</text>
  <rect class="n-ext" x="470" y="792" width="14" height="10" rx="2"/>
  <text class="legt" x="490" y="801">A person</text>
  <line class="arr" x1="590" y1="797" x2="617" y2="797" marker-end="url(#forms-refusal-arrow)"/>
  <text class="legt" x="626" y="801">A call or an event, in order</text>
  </g>
</svg>
