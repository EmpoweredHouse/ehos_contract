<!-- title: Which verdicts can a promise have, and what moves it? -->
<!-- desc: The from event opens the window and makes the verdict pending; eventually or or_else inside the window satisfies it; at the end of the window it is suspended if a system it waits for was unavailable inside the window, and violated if not. -->
<!-- words: verdict, promise, run -->
<!-- technical: pending, satisfied, violated, suspended, from, eventually, or_else -->
<!-- verbs: ends, seen -->
<!-- parts: none = -, pending = -, satisfied = -, violated = -, suspended = - -->
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="promise-verdicts-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="220" y1="228" x2="299" y2="228" marker-end="url(#promise-verdicts-arrow)"/>
  <polyline class="arr" points="420,196 420,80 739,80" marker-end="url(#promise-verdicts-arrow)"/>
  <polyline class="arr" points="480,196 480,104 739,104" marker-end="url(#promise-verdicts-arrow)"/>
  <line class="arr" x1="500" y1="228" x2="739" y2="228" marker-end="url(#promise-verdicts-arrow)"/>
  <polyline class="arr" points="460,260 460,364 739,364" marker-end="url(#promise-verdicts-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="228" y="221" width="56" height="14" rx="2"/>
  <circle class="badge" cx="238" cy="228" r="6"/>
  <text class="badget" x="238" y="231" text-anchor="middle">1</text>
  <text class="lbl" x="250" y="231">from</text>

  <rect class="mask" x="560" y="73" width="98" height="14" rx="2"/>
  <circle class="badge" cx="570" cy="80" r="6"/>
  <text class="badget" x="570" y="83" text-anchor="middle">2</text>
  <text class="lbl" x="582" y="83">eventually</text>

  <rect class="mask" x="560" y="97" width="80" height="14" rx="2"/>
  <circle class="badge" cx="570" cy="104" r="6"/>
  <text class="badget" x="570" y="107" text-anchor="middle">3</text>
  <text class="lbl" x="582" y="107">or_else</text>

  <rect class="mask" x="560" y="221" width="110" height="14" rx="2"/>
  <circle class="badge" cx="570" cy="228" r="6"/>
  <text class="badget" x="570" y="231" text-anchor="middle">4</text>
  <text class="lbl" x="582" y="231">window ends</text>

  <rect class="mask" x="560" y="357" width="110" height="14" rx="2"/>
  <circle class="badge" cx="570" cy="364" r="6"/>
  <text class="badget" x="570" y="367" text-anchor="middle">5</text>
  <text class="lbl" x="582" y="367">outage seen</text>

  <!-- No verdict: the run has no from yet -->
  <rect class="knock" x="40" y="196" width="180" height="64" rx="6"/>
  <rect id="promise-verdicts-none" class="n-back" x="40" y="196" width="180" height="64" rx="6"/>
  <text class="name" x="130" y="222" text-anchor="middle">No verdict</text>
  <text class="sub" x="130" y="240" text-anchor="middle">the run is not judged</text>

  <!-- Pending -->
  <rect class="knock" x="300" y="196" width="200" height="64" rx="6"/>
  <rect id="promise-verdicts-pending" class="n-focal" x="300" y="196" width="200" height="64" rx="6"/>
  <text class="name" x="400" y="222" text-anchor="middle">pending</text>
  <text class="sub" x="400" y="240" text-anchor="middle">the window is open</text>

  <!-- Satisfied -->
  <rect class="knock" x="740" y="60" width="200" height="64" rx="6"/>
  <rect id="promise-verdicts-satisfied" class="n-back" x="740" y="60" width="200" height="64" rx="6"/>
  <text class="name" x="840" y="86" text-anchor="middle">satisfied</text>
  <text class="sub" x="840" y="104" text-anchor="middle">final</text>

  <!-- Violated -->
  <rect class="knock" x="740" y="196" width="200" height="64" rx="6"/>
  <rect id="promise-verdicts-violated" class="n-back" x="740" y="196" width="200" height="64" rx="6"/>
  <text class="name" x="840" y="222" text-anchor="middle">violated</text>
  <text class="sub" x="840" y="240" text-anchor="middle">final</text>

  <!-- Suspended -->
  <rect class="knock" x="740" y="332" width="200" height="64" rx="6"/>
  <rect id="promise-verdicts-suspended" class="n-back" x="740" y="332" width="200" height="64" rx="6"/>
  <text class="name" x="840" y="358" text-anchor="middle">suspended</text>
  <text class="sub" x="840" y="376" text-anchor="middle">final, never violated</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="432" x2="960" y2="432"/>
  <text class="eyes" x="40" y="452">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="472" r="6"/>
  <text class="badget" x="46" y="475" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="476">The first from of the run opens the window.</text>
  <circle class="badge" cx="46" cy="496" r="6"/>
  <text class="badget" x="46" y="499" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="500">eventually occurs inside the window.</text>
  <circle class="badge" cx="46" cy="520" r="6"/>
  <text class="badget" x="46" y="523" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="524">or_else occurs inside the window.</text>

  <circle class="badge" cx="526" cy="472" r="6"/>
  <text class="badget" x="526" y="475" text-anchor="middle">4</text>
  <text class="keyt" x="540" y="476">The window ends, and neither event occurred.</text>
  <circle class="badge" cx="526" cy="496" r="6"/>
  <text class="badget" x="526" y="499" text-anchor="middle">5</text>
  <text class="keyt" x="540" y="500">As 4, but a system that it waits for was unavailable inside it.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="548" x2="960" y2="548"/>
  <rect class="n-focal" x="40" y="564" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="573">The verdict while the window is open</text>
  <rect class="n-back" x="320" y="564" width="14" height="10" rx="2"/>
  <text class="legt" x="340" y="573">Another verdict, or none</text>
  <line class="arr" x1="560" y1="569" x2="587" y2="569" marker-end="url(#promise-verdicts-arrow)"/>
  <text class="legt" x="596" y="573">An event, or the end of the window</text>
  </g>
</svg>
