<!-- title: What does the engine do for each kind of trigger? -->
<!-- desc: Each trigger goes to its own part. The engine compares the events and commands in order, and the rows of an answer one by one. -->
<!-- words: scenario, unit, reaction, recording, read model, query, event, command, rejection -->
<!-- technical: on, record, expect, issues, answers -->
<!-- verbs: compares -->
<!-- parts: scenario = -, unit = -, reaction = -, recording = -, query = -, inorder = -, rows = - -->
<svg viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="scenario-triggers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Connectors (behind the parts) -->
  <polyline class="arr" points="220,332 250,332 250,92 379,92" marker-end="url(#scenario-triggers-arrow)"/>
  <polyline class="arr" points="220,332 250,332 250,212 379,212" marker-end="url(#scenario-triggers-arrow)"/>
  <line class="arr" x1="220" y1="332" x2="379" y2="332" marker-end="url(#scenario-triggers-arrow)"/>
  <polyline class="arr" points="220,332 250,332 250,452 379,452" marker-end="url(#scenario-triggers-arrow)"/>
  <line class="arr" x1="620" y1="92" x2="739" y2="92" marker-end="url(#scenario-triggers-arrow)"/>
  <line class="arr" x1="620" y1="212" x2="739" y2="212" marker-end="url(#scenario-triggers-arrow)"/>
  <line class="arr" x1="620" y1="332" x2="739" y2="332" marker-end="url(#scenario-triggers-arrow)"/>
  <line class="arr" x1="620" y1="452" x2="739" y2="452" marker-end="url(#scenario-triggers-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="266" y="85" width="80" height="14" rx="2"/>
  <circle class="badge" cx="276" cy="92" r="6"/>
  <text class="badget" x="276" y="95" text-anchor="middle">1</text>
  <text class="lbl" x="288" y="95">command</text>

  <rect class="mask" x="266" y="205" width="40" height="14" rx="2"/>
  <circle class="badge" cx="276" cy="212" r="6"/>
  <text class="badget" x="276" y="215" text-anchor="middle">2</text>
  <text class="lbl" x="288" y="215">on</text>

  <rect class="mask" x="266" y="325" width="70" height="14" rx="2"/>
  <circle class="badge" cx="276" cy="332" r="6"/>
  <text class="badget" x="276" y="335" text-anchor="middle">3</text>
  <text class="lbl" x="288" y="335">record</text>

  <rect class="mask" x="266" y="445" width="62" height="14" rx="2"/>
  <circle class="badge" cx="276" cy="452" r="6"/>
  <text class="badget" x="276" y="455" text-anchor="middle">4</text>
  <text class="lbl" x="288" y="455">query</text>

  <rect class="mask" x="634" y="85" width="70" height="14" rx="2"/>
  <circle class="badge" cx="644" cy="92" r="6"/>
  <text class="badget" x="644" y="95" text-anchor="middle">5</text>
  <text class="lbl" x="656" y="95">expect</text>

  <rect class="mask" x="634" y="205" width="70" height="14" rx="2"/>
  <circle class="badge" cx="644" cy="212" r="6"/>
  <text class="badget" x="644" y="215" text-anchor="middle">6</text>
  <text class="lbl" x="656" y="215">issues</text>

  <rect class="mask" x="634" y="325" width="70" height="14" rx="2"/>
  <circle class="badge" cx="644" cy="332" r="6"/>
  <text class="badget" x="644" y="335" text-anchor="middle">7</text>
  <text class="lbl" x="656" y="335">expect</text>

  <rect class="mask" x="634" y="445" width="78" height="14" rx="2"/>
  <circle class="badge" cx="644" cy="452" r="6"/>
  <text class="badget" x="644" y="455" text-anchor="middle">8</text>
  <text class="lbl" x="656" y="455">answers</text>

  <!-- The scenario -->
  <rect class="knock" x="40" y="300" width="180" height="64" rx="6"/>
  <rect id="scenario-triggers-scenario" class="n-focal" x="40" y="300" width="180" height="64" rx="6"/>
  <text class="name" x="130" y="326" text-anchor="middle">Scenario</text>
  <text class="sub" x="130" y="344" text-anchor="middle">given, trigger, outcome</text>

  <!-- A command -->
  <rect class="knock" x="380" y="60" width="240" height="64" rx="6"/>
  <rect id="scenario-triggers-unit" class="n-back" x="380" y="60" width="240" height="64" rx="6"/>
  <text class="name" x="500" y="86" text-anchor="middle">Unit</text>
  <text class="sub" x="500" y="104" text-anchor="middle">evolve/2 folds; the callback decides</text>

  <!-- An event for a reaction -->
  <rect class="knock" x="380" y="180" width="240" height="64" rx="6"/>
  <rect id="scenario-triggers-reaction" class="n-back" x="380" y="180" width="240" height="64" rx="6"/>
  <text class="name" x="500" y="206" text-anchor="middle">Reaction</text>
  <text class="sub" x="500" y="224" text-anchor="middle">the callback reacts</text>

  <!-- A recording -->
  <rect class="knock" x="380" y="300" width="240" height="64" rx="6"/>
  <rect id="scenario-triggers-recording" class="n-shared" x="380" y="300" width="240" height="64" rx="6"/>
  <text class="name" x="500" y="326" text-anchor="middle">Recording</text>
  <text class="sub" x="500" y="344" text-anchor="middle">no code runs</text>

  <!-- A query -->
  <rect class="knock" x="380" y="420" width="240" height="64" rx="6"/>
  <rect id="scenario-triggers-query" class="n-back" x="380" y="420" width="240" height="64" rx="6"/>
  <text class="name" x="500" y="446" text-anchor="middle">Read model and query</text>
  <text class="sub" x="500" y="464" text-anchor="middle">projects the givens; answers</text>

  <!-- Compared in order -->
  <rect class="knock" x="740" y="60" width="220" height="304" rx="6"/>
  <rect id="scenario-triggers-inorder" class="n-shared" x="740" y="60" width="220" height="304" rx="6"/>
  <text class="name" x="850" y="206" text-anchor="middle">Events, commands, rejections</text>
  <text class="sub" x="850" y="224" text-anchor="middle">in order, others between</text>

  <!-- Compared row by row -->
  <rect class="knock" x="740" y="420" width="220" height="64" rx="6"/>
  <rect id="scenario-triggers-rows" class="n-shared" x="740" y="420" width="220" height="64" rx="6"/>
  <text class="name" x="850" y="446" text-anchor="middle">Rows of the query</text>
  <text class="sub" x="850" y="464" text-anchor="middle">each row, and no other</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="516" x2="960" y2="516"/>
  <text class="eyes" x="40" y="536">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="556" r="6"/>
  <text class="badget" x="46" y="559" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="560">A command goes to its unit, which folds the givens and decides.</text>
  <circle class="badge" cx="46" cy="580" r="6"/>
  <text class="badget" x="46" y="583" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="584">An event goes to a policy or a process manager, which reacts.</text>
  <circle class="badge" cx="46" cy="604" r="6"/>
  <text class="badget" x="46" y="607" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="608">A recording runs no code: the engine checks the event.</text>
  <circle class="badge" cx="46" cy="628" r="6"/>
  <text class="badget" x="46" y="631" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="632">The read model projects the givens, and the query answers.</text>

  <circle class="badge" cx="526" cy="556" r="6"/>
  <text class="badget" x="526" y="559" text-anchor="middle">5</text>
  <text class="keyt" x="540" y="560">The engine compares the decision with expect or rejected.</text>
  <circle class="badge" cx="526" cy="580" r="6"/>
  <text class="badget" x="526" y="583" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="584">It compares the issued commands with issues.</text>
  <circle class="badge" cx="526" cy="604" r="6"/>
  <text class="badget" x="526" y="607" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="608">It compares the recorded event with expect or rejected.</text>
  <circle class="badge" cx="526" cy="628" r="6"/>
  <text class="badget" x="526" y="631" text-anchor="middle">8</text>
  <text class="keyt" x="540" y="632">It compares the rows with answers.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="648" x2="960" y2="648"/>
  <rect class="n-focal" x="40" y="660" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="669">The scenario</text>
  <rect class="n-back" x="180" y="660" width="14" height="10" rx="2"/>
  <text class="legt" x="200" y="669">Code of your application</text>
  <rect class="n-shared" x="380" y="660" width="14" height="10" rx="2"/>
  <text class="legt" x="400" y="669">What the engine checks</text>
  <line class="arr" x1="580" y1="665" x2="607" y2="665" marker-end="url(#scenario-triggers-arrow)"/>
  <text class="legt" x="616" y="669">The trigger, then the outcome</text>
  </g>
</svg>
