<!-- title: What occurs when I dispatch a command? -->
<!-- desc: Dispatch checks the actor, then in one transaction reads and folds the unit, gets the decision, appends the declared events and runs the consumers. -->
<!-- words: application, dispatch, authorizer, implementation, log, consumer -->
<!-- technical: EhOsContract.dispatch/3 -->
<!-- verbs: dispatches, asks, reads, folds, decides, appends, runs, returns, delivers -->
<!-- parts: application = -, dispatch = -, authorizer = -, implementation = -, log = -, consumer = - -->
<svg viewBox="0 0 1000 784" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="dispatch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- The transaction that dispatch owns -->
  <rect class="zone" x="40" y="236" width="920" height="216" rx="8"/>
  <rect class="mask" x="56" y="230" width="124" height="12" rx="2"/>
  <text class="zlabel" x="60" y="239">ONE TRANSACTION</text>

  <!-- Lifelines -->
  <line class="rule" x1="100" y1="120" x2="100" y2="548"/>
  <line class="rule" x1="260" y1="120" x2="260" y2="548"/>
  <line class="rule" x1="420" y1="120" x2="420" y2="548"/>
  <line class="rule" x1="580" y1="120" x2="580" y2="548"/>
  <line class="rule" x1="740" y1="120" x2="740" y2="548"/>
  <line class="rule" x1="900" y1="120" x2="900" y2="548"/>

  <!-- Messages, top to bottom -->
  <line class="arr" x1="100" y1="168" x2="259" y2="168" marker-end="url(#dispatch-arrow)"/>
  <line class="uses" x1="260" y1="208" x2="419" y2="208" marker-end="url(#dispatch-arrow)"/>
  <line class="arr" x1="260" y1="272" x2="739" y2="272" marker-end="url(#dispatch-arrow)"/>
  <line class="arr" x1="260" y1="312" x2="579" y2="312" marker-end="url(#dispatch-arrow)"/>
  <line class="arr" x1="580" y1="352" x2="261" y2="352" marker-end="url(#dispatch-arrow)"/>
  <line class="arr" x1="260" y1="392" x2="739" y2="392" marker-end="url(#dispatch-arrow)"/>
  <line class="arr" x1="260" y1="432" x2="899" y2="432" marker-end="url(#dispatch-arrow)"/>
  <line class="arr" x1="260" y1="484" x2="101" y2="484" marker-end="url(#dispatch-arrow)"/>
  <line class="uses" x1="740" y1="524" x2="899" y2="524" marker-end="url(#dispatch-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="112" y="146" width="88" height="14" rx="2"/>
  <circle class="badge" cx="122" cy="153" r="6"/>
  <text class="badget" x="122" y="156" text-anchor="middle">1</text>
  <text class="lbl" x="134" y="156">DISPATCHES</text>

  <rect class="mask" x="272" y="186" width="56" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="193" r="6"/>
  <text class="badget" x="282" y="196" text-anchor="middle">2</text>
  <text class="lbl" x="294" y="196">ASKS</text>

  <rect class="mask" x="272" y="250" width="60" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="257" r="6"/>
  <text class="badget" x="282" y="260" text-anchor="middle">3</text>
  <text class="lbl" x="294" y="260">READS</text>

  <rect class="mask" x="272" y="290" width="60" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="297" r="6"/>
  <text class="badget" x="282" y="300" text-anchor="middle">4</text>
  <text class="lbl" x="294" y="300">FOLDS</text>

  <rect class="mask" x="488" y="330" width="76" height="14" rx="2"/>
  <circle class="badge" cx="498" cy="337" r="6"/>
  <text class="badget" x="498" y="340" text-anchor="middle">5</text>
  <text class="lbl" x="510" y="340">DECIDES</text>

  <rect class="mask" x="272" y="370" width="76" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="377" r="6"/>
  <text class="badget" x="282" y="380" text-anchor="middle">6</text>
  <text class="lbl" x="294" y="380">APPENDS</text>

  <rect class="mask" x="272" y="410" width="56" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="417" r="6"/>
  <text class="badget" x="282" y="420" text-anchor="middle">7</text>
  <text class="lbl" x="294" y="420">RUNS</text>

  <rect class="mask" x="168" y="462" width="76" height="14" rx="2"/>
  <circle class="badge" cx="178" cy="469" r="6"/>
  <text class="badget" x="178" y="472" text-anchor="middle">8</text>
  <text class="lbl" x="190" y="472">RETURNS</text>

  <rect class="mask" x="752" y="502" width="84" height="14" rx="2"/>
  <circle class="badge" cx="762" cy="509" r="6"/>
  <text class="badget" x="762" y="512" text-anchor="middle">9</text>
  <text class="lbl" x="774" y="512">DELIVERS</text>

  <!-- The application -->
  <rect class="knock" x="36" y="64" width="128" height="56" rx="6"/>
  <rect id="dispatch-application" class="n-back" x="36" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="100" y="88" text-anchor="middle">Application</text>
  <text class="sub" x="100" y="106" text-anchor="middle">your code</text>

  <!-- Dispatch -->
  <rect class="knock" x="184" y="64" width="152" height="56" rx="6"/>
  <rect id="dispatch-dispatch" class="n-focal" x="184" y="64" width="152" height="56" rx="6"/>
  <text class="name" x="260" y="88" text-anchor="middle">Dispatch</text>
  <text class="sub" x="260" y="106" text-anchor="middle">EhOsContract.dispatch/3</text>

  <!-- The authorizer -->
  <rect class="knock" x="356" y="64" width="128" height="56" rx="6"/>
  <rect id="dispatch-authorizer" class="n-back" x="356" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="420" y="88" text-anchor="middle">Authorizer</text>
  <text class="sub" x="420" y="106" text-anchor="middle">your module</text>

  <!-- The implementation -->
  <rect class="knock" x="516" y="64" width="128" height="56" rx="6"/>
  <rect id="dispatch-implementation" class="n-back" x="516" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="580" y="88" text-anchor="middle">Implementation</text>
  <text class="sub" x="580" y="106" text-anchor="middle">your module</text>

  <!-- The log -->
  <rect class="knock" x="676" y="64" width="128" height="56" rx="6"/>
  <rect id="dispatch-log" class="n-store" x="676" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="740" y="88" text-anchor="middle">Log</text>
  <text class="sub" x="740" y="106" text-anchor="middle">the engine's table</text>

  <!-- The consumers -->
  <rect class="knock" x="836" y="64" width="128" height="56" rx="6"/>
  <rect id="dispatch-consumer" class="n-back" x="836" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="900" y="88" text-anchor="middle">Consumers</text>
  <text class="sub" x="900" y="106" text-anchor="middle">your modules</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="580" x2="960" y2="580"/>
  <text class="eyes" x="40" y="600">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="620" r="6"/>
  <text class="badget" x="46" y="623" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="624">The application dispatches a command with its actor.</text>
  <circle class="badge" cx="46" cy="644" r="6"/>
  <text class="badget" x="46" y="647" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="648">For an actor from a credential, dispatch asks the authorizer.</text>
  <circle class="badge" cx="46" cy="668" r="6"/>
  <text class="badget" x="46" y="671" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="672">Dispatch reads the events of the unit.</text>
  <circle class="badge" cx="46" cy="692" r="6"/>
  <text class="badget" x="46" y="695" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="696">Dispatch folds them into the state with evolve/2.</text>
  <circle class="badge" cx="46" cy="716" r="6"/>
  <text class="badget" x="46" y="719" text-anchor="middle">5</text>
  <text class="keyt" x="60" y="720">The implementation decides: events, or a rejection.</text>

  <circle class="badge" cx="526" cy="620" r="6"/>
  <text class="badget" x="526" y="623" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="624">Dispatch appends the declared events.</text>
  <circle class="badge" cx="526" cy="644" r="6"/>
  <text class="badget" x="526" y="647" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="648">Dispatch runs consumers :in_transaction and queues effect jobs.</text>
  <circle class="badge" cx="526" cy="668" r="6"/>
  <text class="badget" x="526" y="671" text-anchor="middle">8</text>
  <text class="keyt" x="540" y="672">After the commit, dispatch returns {:ok, receipt}.</text>
  <circle class="badge" cx="526" cy="692" r="6"/>
  <text class="badget" x="526" y="695" text-anchor="middle">9</text>
  <text class="keyt" x="540" y="696">After the commit, the log feeds the other consumers, in order.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="740" x2="960" y2="740"/>
  <rect class="n-focal" x="40" y="756" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="765">The engine</text>
  <rect class="n-back" x="150" y="756" width="14" height="10" rx="2"/>
  <text class="legt" x="170" y="765">Code of your application</text>
  <rect class="n-store" x="330" y="756" width="14" height="10" rx="2"/>
  <text class="legt" x="350" y="765">Kept by the engine</text>
  <line class="arr" x1="480" y1="761" x2="507" y2="761" marker-end="url(#dispatch-arrow)"/>
  <text class="legt" x="516" y="765">A call, in order</text>
  <line class="uses" x1="640" y1="761" x2="667" y2="761" marker-end="url(#dispatch-arrow)"/>
  <text class="legt" x="676" y="765">Only for some actors, or after the commit</text>
  </g>
</svg>
