<!-- title: Which context depends on which? -->
<!-- desc: The loans contract names the copy that the catalogue owns, so loans depends on the catalogue, and their customer-supplier relation allows it. -->
<!-- words: context, contract, entity -->
<!-- technical: customer_supplier -->
<!-- verbs: names, owns, holds, supplies -->
<!-- parts: catalogue = -, loans = -, events = -, copy = -, contract = - -->
<svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="domain-relations-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="392" y1="308" x2="277" y2="308" marker-end="url(#domain-relations-arrow)"/>
  <line class="arr" x1="168" y1="168" x2="168" y2="271" marker-end="url(#domain-relations-arrow)"/>
  <line class="arr" x1="500" y1="168" x2="500" y2="271" marker-end="url(#domain-relations-arrow)"/>
  <line class="arr" x1="276" y1="132" x2="391" y2="132" marker-end="url(#domain-relations-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="294" y="286" width="68" height="14" rx="2"/>
  <circle class="badge" cx="304" cy="293" r="6"/>
  <text class="badget" x="304" y="296" text-anchor="middle">1</text>
  <text class="lbl" x="316" y="296">NAMES</text>

  <rect class="mask" x="180" y="212" width="60" height="14" rx="2"/>
  <circle class="badge" cx="190" cy="219" r="6"/>
  <text class="badget" x="190" y="222" text-anchor="middle">2</text>
  <text class="lbl" x="202" y="222">OWNS</text>

  <rect class="mask" x="512" y="212" width="64" height="14" rx="2"/>
  <circle class="badge" cx="522" cy="219" r="6"/>
  <text class="badget" x="522" y="222" text-anchor="middle">3</text>
  <text class="lbl" x="534" y="222">HOLDS</text>

  <rect class="mask" x="290" y="110" width="84" height="14" rx="2"/>
  <circle class="badge" cx="300" cy="117" r="6"/>
  <text class="badget" x="300" y="120" text-anchor="middle">4</text>
  <text class="lbl" x="312" y="120">SUPPLIES</text>

  <!-- The catalogue context -->
  <rect class="knock" x="60" y="96" width="216" height="72" rx="6"/>
  <rect id="domain-relations-catalogue" class="n-back" x="60" y="96" width="216" height="72" rx="6"/>
  <text class="name" x="168" y="126" text-anchor="middle">Catalogue context</text>
  <text class="sub" x="168" y="144" text-anchor="middle">upstream</text>

  <!-- The loans context -->
  <rect class="knock" x="392" y="96" width="216" height="72" rx="6"/>
  <rect id="domain-relations-loans" class="n-focal" x="392" y="96" width="216" height="72" rx="6"/>
  <text class="name" x="500" y="126" text-anchor="middle">Loans context</text>
  <text class="sub" x="500" y="144" text-anchor="middle">downstream</text>

  <!-- The library events context -->
  <rect class="knock" x="724" y="96" width="216" height="72" rx="6"/>
  <rect id="domain-relations-events" class="n-back" x="724" y="96" width="216" height="72" rx="6"/>
  <text class="name" x="832" y="126" text-anchor="middle">Library events context</text>
  <text class="sub" x="832" y="144" text-anchor="middle">separate ways from loans</text>

  <!-- The copy entity -->
  <rect class="knock" x="60" y="272" width="216" height="72" rx="6"/>
  <rect id="domain-relations-copy" class="n-back" x="60" y="272" width="216" height="72" rx="6"/>
  <text class="name" x="168" y="302" text-anchor="middle">Copy entity</text>
  <text class="sub" x="168" y="320" text-anchor="middle">:copy</text>

  <!-- The loans contract -->
  <rect class="knock" x="392" y="272" width="216" height="72" rx="6"/>
  <rect id="domain-relations-contract" class="n-back" x="392" y="272" width="216" height="72" rx="6"/>
  <text class="name" x="500" y="302" text-anchor="middle">Loans contract</text>
  <text class="sub" x="500" y="320" text-anchor="middle">a field {:id, :copy}</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="384" x2="960" y2="384"/>
  <text class="eyes" x="40" y="404">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="424" r="6"/>
  <text class="badget" x="46" y="427" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="428">The loans contract names the copy entity.</text>
  <circle class="badge" cx="46" cy="448" r="6"/>
  <text class="badget" x="46" y="451" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="452">The catalogue context owns the copy entity.</text>

  <circle class="badge" cx="526" cy="424" r="6"/>
  <text class="badget" x="526" y="427" text-anchor="middle">3</text>
  <text class="keyt" x="540" y="428">The loans context holds the loans contract.</text>
  <circle class="badge" cx="526" cy="448" r="6"/>
  <text class="badget" x="526" y="451" text-anchor="middle">4</text>
  <text class="keyt" x="540" y="452">The catalogue supplies loans: a customer_supplier relation.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="488" x2="960" y2="488"/>
  <rect class="n-focal" x="40" y="504" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="513">The context that depends</text>
  <rect class="n-back" x="260" y="504" width="14" height="10" rx="2"/>
  <text class="legt" x="280" y="513">A context, an entity or a contract</text>
  <line class="arr" x1="560" y1="509" x2="587" y2="509" marker-end="url(#domain-relations-arrow)"/>
  <text class="legt" x="596" y="513">A reference or a relation</text>
  </g>
</svg>
