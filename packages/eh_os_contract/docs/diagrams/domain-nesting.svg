<!-- title: How do a domain, a contract and a process module fit together? -->
<!-- desc: A domain holds shared words and contexts; each contract belongs to one context; a process module of the domain includes events of its contracts. -->
<!-- words: actor, subject, value, external system, contract, unit, reaction, read model, query, process module -->
<!-- technical: Lending.Contracts.Loans, Lending.Contracts.Membership, Lending.Processes.Loan -->
<!-- parts: words = -, loans = -, membership = -, unit = -, reaction = -, readmodel = -, query = -, process = - -->
<svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg">
  <rect class="bg" width="100%" height="100%"/>

  <!-- 1. The domain -->
  <rect class="zone" x="40" y="56" width="920" height="408" rx="8"/>
  <rect class="mask" x="52" y="49" width="196" height="14" rx="2"/>
  <circle class="badge" cx="62" cy="56" r="6"/>
  <text class="badget" x="62" y="59" text-anchor="middle">1</text>
  <text class="zlabel" x="74" y="59">DOMAIN · LENDING.DOMAIN</text>

  <!-- 2. The words that every context shares -->
  <rect class="knock" x="72" y="88" width="856" height="56" rx="6"/>
  <rect id="domain-nesting-words" class="n-shared" x="72" y="88" width="856" height="56" rx="6"/>
  <circle class="badge" cx="92" cy="111" r="6"/>
  <text class="badget" x="92" y="114" text-anchor="middle">2</text>
  <text class="name" x="108" y="115">Actors, subjects, values and external systems</text>
  <text class="sub" x="108" y="132">declared in the domain; an actor can belong to one context</text>

  <!-- 3. Two contexts -->
  <rect class="zone" x="72" y="176" width="416" height="192" rx="8"/>
  <rect class="mask" x="84" y="169" width="140" height="14" rx="2"/>
  <circle class="badge" cx="94" cy="176" r="6"/>
  <text class="badget" x="94" y="179" text-anchor="middle">3</text>
  <text class="zlabel" x="106" y="179">CONTEXT · LOANS</text>

  <rect class="zone" x="512" y="176" width="416" height="192" rx="8"/>
  <rect class="mask" x="524" y="169" width="164" height="14" rx="2"/>
  <circle class="badge" cx="534" cy="176" r="6"/>
  <text class="badget" x="534" y="179" text-anchor="middle">3</text>
  <text class="zlabel" x="546" y="179">CONTEXT · MEMBERSHIP</text>

  <!-- 4. A contract in each context -->
  <rect class="knock" x="96" y="200" width="368" height="144" rx="6"/>
  <rect id="domain-nesting-loans" class="n-focal" x="96" y="200" width="368" height="144" rx="6"/>
  <circle class="badge" cx="116" cy="223" r="6"/>
  <text class="badget" x="116" y="226" text-anchor="middle">4</text>
  <text class="name" x="132" y="227">Contract</text>
  <text class="sub" x="132" y="244">Lending.Contracts.Loans</text>

  <rect id="domain-nesting-unit" class="chip" x="120" y="260" width="152" height="28" rx="4"/>
  <text class="chipt" x="196" y="278" text-anchor="middle">Unit</text>
  <rect id="domain-nesting-reaction" class="chip" x="288" y="260" width="152" height="28" rx="4"/>
  <text class="chipt" x="364" y="278" text-anchor="middle">Reaction</text>
  <rect id="domain-nesting-readmodel" class="chip" x="120" y="300" width="152" height="28" rx="4"/>
  <text class="chipt" x="196" y="318" text-anchor="middle">Read model</text>
  <rect id="domain-nesting-query" class="chip" x="288" y="300" width="152" height="28" rx="4"/>
  <text class="chipt" x="364" y="318" text-anchor="middle">Query</text>

  <rect class="knock" x="536" y="200" width="368" height="144" rx="6"/>
  <rect id="domain-nesting-membership" class="n-back" x="536" y="200" width="368" height="144" rx="6"/>
  <circle class="badge" cx="556" cy="223" r="6"/>
  <text class="badget" x="556" y="226" text-anchor="middle">4</text>
  <text class="name" x="572" y="227">Contract</text>
  <text class="sub" x="572" y="244">Lending.Contracts.Membership</text>
  <text class="sub" x="572" y="262">its own units, consumers and queries</text>

  <!-- 5. The process module, across the contracts of the domain -->
  <rect class="knock" x="72" y="392" width="856" height="48" rx="6"/>
  <rect id="domain-nesting-process" class="n-back" x="72" y="392" width="856" height="48" rx="6"/>
  <circle class="badge" cx="92" cy="416" r="6"/>
  <text class="badget" x="92" y="419" text-anchor="middle">5</text>
  <text class="name" x="108" y="420">Process module</text>
  <text class="sub" x="248" y="419">Lending.Processes.Loan: stages, promises, a deadline, over events of both contracts</text>

  <!-- Key: the numbered parts in words -->
  <g class="key">
  <line class="rule" x1="40" y1="496" x2="960" y2="496"/>
  <text class="eyes" x="40" y="516">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="536" r="6"/>
  <text class="badget" x="46" y="539" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="540">A domain holds the words of one business.</text>
  <circle class="badge" cx="46" cy="560" r="6"/>
  <text class="badget" x="46" y="563" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="564">The contracts and the process modules use these words.</text>
  <circle class="badge" cx="46" cy="584" r="6"/>
  <text class="badget" x="46" y="587" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="588">In a context, each word has one meaning.</text>

  <circle class="badge" cx="526" cy="536" r="6"/>
  <text class="badget" x="526" y="539" text-anchor="middle">4</text>
  <text class="keyt" x="540" y="540">A contract belongs to one context.</text>
  <circle class="badge" cx="526" cy="560" r="6"/>
  <text class="badget" x="526" y="563" text-anchor="middle">5</text>
  <text class="keyt" x="540" y="564">A process module includes events of contracts of its domain.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="616" x2="960" y2="616"/>
  <rect class="zone" x="40" y="632" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="641">A domain or a context</text>
  <rect class="n-focal" x="200" y="632" width="14" height="10" rx="2"/>
  <text class="legt" x="220" y="641">The contract that the chips describe</text>
  <rect class="n-back" x="420" y="632" width="14" height="10" rx="2"/>
  <text class="legt" x="440" y="641">Another module</text>
  <rect class="n-shared" x="560" y="632" width="14" height="10" rx="2"/>
  <text class="legt" x="580" y="641">Words of the domain</text>
  <rect class="chip" x="720" y="632" width="14" height="10" rx="2"/>
  <text class="legt" x="740" y="641">A kind of declaration</text>
  </g>
</svg>
