<!-- title: How does an event become a row and an answer? -->
<!-- desc: The implementation of a read model writes rows from each event, in the transaction of dispatch or later from a subscription, and a query answers from those rows. -->
<!-- words: dispatch, log, subscription, implementation, read model, application, query -->
<!-- technical: EhOsContract.query/3 -->
<!-- verbs: appends, reads, runs, writes, asks, calls, returns -->
<!-- parts: dispatch = -, log = -, subscription = -, projection = -, application = -, query = -, answer = -, rows = - -->
<svg viewBox="0 0 1000 740" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="reading-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="190" y1="152" x2="289" y2="152" marker-end="url(#reading-flow-arrow)"/>
  <line class="uses" x1="440" y1="152" x2="539" y2="152" marker-end="url(#reading-flow-arrow)"/>
  <line class="uses" x1="690" y1="152" x2="789" y2="152" marker-end="url(#reading-flow-arrow)"/>
  <polyline class="arr" points="115,120 115,72 865,72 865,119" marker-end="url(#reading-flow-arrow)"/>
  <line class="arr" x1="865" y1="184" x2="865" y2="399" marker-end="url(#reading-flow-arrow)"/>
  <line class="arr" x1="190" y1="420" x2="289" y2="420" marker-end="url(#reading-flow-arrow)"/>
  <line class="arr" x1="440" y1="420" x2="539" y2="420" marker-end="url(#reading-flow-arrow)"/>
  <line class="arr" x1="690" y1="420" x2="789" y2="420" marker-end="url(#reading-flow-arrow)"/>
  <line class="arr" x1="290" y1="448" x2="191" y2="448" marker-end="url(#reading-flow-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="198" y="122" width="84" height="14" rx="2"/>
  <circle class="badge" cx="208" cy="129" r="6"/>
  <text class="badget" x="208" y="132" text-anchor="middle">1</text>
  <text class="lbl" x="220" y="132">appends</text>

  <rect class="mask" x="448" y="122" width="68" height="14" rx="2"/>
  <circle class="badge" cx="458" cy="129" r="6"/>
  <text class="badget" x="458" y="132" text-anchor="middle">2</text>
  <text class="lbl" x="470" y="132">reads</text>

  <rect class="mask" x="698" y="122" width="60" height="14" rx="2"/>
  <circle class="badge" cx="708" cy="129" r="6"/>
  <text class="badget" x="708" y="132" text-anchor="middle">3</text>
  <text class="lbl" x="720" y="132">runs</text>

  <rect class="mask" x="460" y="50" width="60" height="14" rx="2"/>
  <circle class="badge" cx="470" cy="57" r="6"/>
  <text class="badget" x="470" y="60" text-anchor="middle">4</text>
  <text class="lbl" x="482" y="60">runs</text>

  <rect class="mask" x="877" y="284" width="68" height="14" rx="2"/>
  <circle class="badge" cx="887" cy="291" r="6"/>
  <text class="badget" x="887" y="294" text-anchor="middle">5</text>
  <text class="lbl" x="899" y="294">writes</text>

  <rect class="mask" x="198" y="390" width="56" height="14" rx="2"/>
  <circle class="badge" cx="208" cy="397" r="6"/>
  <text class="badget" x="208" y="400" text-anchor="middle">6</text>
  <text class="lbl" x="220" y="400">asks</text>

  <rect class="mask" x="448" y="390" width="64" height="14" rx="2"/>
  <circle class="badge" cx="458" cy="397" r="6"/>
  <text class="badget" x="458" y="400" text-anchor="middle">7</text>
  <text class="lbl" x="470" y="400">calls</text>

  <rect class="mask" x="698" y="390" width="64" height="14" rx="2"/>
  <circle class="badge" cx="708" cy="397" r="6"/>
  <text class="badget" x="708" y="400" text-anchor="middle">8</text>
  <text class="lbl" x="720" y="400">reads</text>

  <rect class="mask" x="198" y="456" width="80" height="14" rx="2"/>
  <circle class="badge" cx="208" cy="463" r="6"/>
  <text class="badget" x="208" y="466" text-anchor="middle">9</text>
  <text class="lbl" x="220" y="466">returns</text>

  <!-- Dispatch -->
  <rect class="knock" x="40" y="120" width="150" height="64" rx="6"/>
  <rect id="reading-flow-dispatch" class="n-back" x="40" y="120" width="150" height="64" rx="6"/>
  <text class="name" x="115" y="148" text-anchor="middle">Dispatch</text>
  <text class="sub" x="115" y="166" text-anchor="middle">appends an event</text>

  <!-- The log -->
  <rect class="knock" x="290" y="120" width="150" height="64" rx="6"/>
  <rect id="reading-flow-log" class="n-store" x="290" y="120" width="150" height="64" rx="6"/>
  <text class="name" x="365" y="148" text-anchor="middle">Log</text>
  <text class="sub" x="365" y="166" text-anchor="middle">each event, in order</text>

  <!-- The subscription -->
  <rect class="knock" x="540" y="120" width="150" height="64" rx="6"/>
  <rect id="reading-flow-subscription" class="n-back" x="540" y="120" width="150" height="64" rx="6"/>
  <text class="name" x="615" y="148" text-anchor="middle">Subscription</text>
  <text class="sub" x="615" y="166" text-anchor="middle">:at_least_once</text>

  <!-- The implementation of the read model -->
  <rect class="knock" x="790" y="120" width="150" height="64" rx="6"/>
  <rect id="reading-flow-projection" class="n-back" x="790" y="120" width="150" height="64" rx="6"/>
  <text class="name" x="865" y="148" text-anchor="middle">Implementation</text>
  <text class="sub" x="865" y="166" text-anchor="middle">of the read model</text>

  <!-- The application -->
  <rect class="knock" x="40" y="392" width="150" height="64" rx="6"/>
  <rect id="reading-flow-application" class="n-back" x="40" y="392" width="150" height="64" rx="6"/>
  <text class="name" x="115" y="420" text-anchor="middle">Application</text>
  <text class="sub" x="115" y="438" text-anchor="middle">with an actor</text>

  <!-- The query, in the engine -->
  <rect class="knock" x="290" y="392" width="150" height="64" rx="6"/>
  <rect id="reading-flow-query" class="n-back" x="290" y="392" width="150" height="64" rx="6"/>
  <text class="name" x="365" y="420" text-anchor="middle">Query</text>
  <text class="sub" x="365" y="438" text-anchor="middle">EhOsContract.query/3</text>

  <!-- The implementation of the query -->
  <rect class="knock" x="540" y="392" width="150" height="64" rx="6"/>
  <rect id="reading-flow-answer" class="n-back" x="540" y="392" width="150" height="64" rx="6"/>
  <text class="name" x="615" y="420" text-anchor="middle">Implementation</text>
  <text class="sub" x="615" y="438" text-anchor="middle">of the query</text>

  <!-- The rows of the read model -->
  <rect class="knock" x="790" y="392" width="150" height="64" rx="6"/>
  <rect id="reading-flow-rows" class="n-focal" x="790" y="392" width="150" height="64" rx="6"/>
  <text class="name" x="865" y="420" text-anchor="middle">Read model</text>
  <text class="sub" x="865" y="438" text-anchor="middle">rows in your table</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="508" x2="960" y2="508"/>
  <text class="eyes" x="40" y="528">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="548" r="6"/>
  <text class="badget" x="46" y="551" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="552">Dispatch appends an event to the log.</text>
  <circle class="badge" cx="46" cy="572" r="6"/>
  <text class="badget" x="46" y="575" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="576">For :at_least_once, a subscription reads the log after the commit.</text>
  <circle class="badge" cx="46" cy="596" r="6"/>
  <text class="badget" x="46" y="599" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="600">The subscription runs the implementation for each event.</text>
  <circle class="badge" cx="46" cy="620" r="6"/>
  <text class="badget" x="46" y="623" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="624">For :in_transaction, dispatch runs it before the commit.</text>
  <circle class="badge" cx="46" cy="644" r="6"/>
  <text class="badget" x="46" y="647" text-anchor="middle">5</text>
  <text class="keyt" x="60" y="648">The implementation writes rows to the table of the read model.</text>

  <circle class="badge" cx="526" cy="548" r="6"/>
  <text class="badget" x="526" y="551" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="552">The application asks a query, with the actor.</text>
  <circle class="badge" cx="526" cy="572" r="6"/>
  <text class="badget" x="526" y="575" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="576">If the actor can ask, the engine calls the implementation.</text>
  <circle class="badge" cx="526" cy="596" r="6"/>
  <text class="badget" x="526" y="599" text-anchor="middle">8</text>
  <text class="keyt" x="540" y="600">The implementation reads the rows.</text>
  <circle class="badge" cx="526" cy="620" r="6"/>
  <text class="badget" x="526" y="623" text-anchor="middle">9</text>
  <text class="keyt" x="540" y="624">The engine checks the rows, then returns them.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="680" x2="960" y2="680"/>
  <rect class="n-focal" x="40" y="696" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="705">The subject</text>
  <rect class="n-back" x="150" y="696" width="14" height="10" rx="2"/>
  <text class="legt" x="170" y="705">The engine, or your code</text>
  <rect class="n-store" x="340" y="696" width="14" height="10" rx="2"/>
  <text class="legt" x="360" y="705">Kept by the engine</text>
  <line class="arr" x1="500" y1="701" x2="527" y2="701" marker-end="url(#reading-flow-arrow)"/>
  <text class="legt" x="536" y="705">A call</text>
  <line class="uses" x1="610" y1="701" x2="637" y2="701" marker-end="url(#reading-flow-arrow)"/>
  <text class="legt" x="646" y="705">After the commit</text>
  </g>
</svg>
