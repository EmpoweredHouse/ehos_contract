<!-- title: What occurs from a keystroke to a refusal? -->
<!-- desc: The page builds the changeset on each change; on submit, it dispatches the command, and puts the refusal of dispatch back on the form. -->
<!-- words: form, dispatch, implementation -->
<!-- technical: Person, Page -->
<!-- verbs: types, builds, returns, submits, converts, dispatches, rejects, puts, shows -->
<!-- parts: person = -, page = -, form = -, dispatch = -, implementation = - -->
<svg viewBox="0 0 1000 816" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="form-refusal-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- On each change, and on submit -->
  <rect class="zone" x="40" y="144" width="920" height="124" rx="8"/>
  <rect class="mask" x="56" y="138" width="124" height="12" rx="2"/>
  <text class="zlabel" x="60" y="147">ON EACH CHANGE</text>
  <rect class="zone" x="40" y="280" width="920" height="280" rx="8"/>
  <rect class="mask" x="56" y="274" width="84" height="12" rx="2"/>
  <text class="zlabel" x="60" y="283">ON SUBMIT</text>

  <!-- Lifelines -->
  <line class="rule" x1="100" y1="120" x2="100" y2="576"/>
  <line class="rule" x1="300" y1="120" x2="300" y2="576"/>
  <line class="rule" x1="500" y1="120" x2="500" y2="576"/>
  <line class="rule" x1="700" y1="120" x2="700" y2="576"/>
  <line class="rule" x1="900" y1="120" x2="900" y2="576"/>

  <!-- Messages, top to bottom -->
  <line class="arr" x1="100" y1="176" x2="299" y2="176" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="300" y1="208" x2="499" y2="208" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="500" y1="240" x2="301" y2="240" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="100" y1="312" x2="299" y2="312" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="300" y1="344" x2="499" y2="344" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="300" y1="376" x2="699" y2="376" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="900" y1="408" x2="701" y2="408" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="700" y1="440" x2="301" y2="440" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="300" y1="472" x2="499" y2="472" marker-end="url(#form-refusal-arrow)"/>
  <line class="arr" x1="300" y1="528" x2="101" y2="528" marker-end="url(#form-refusal-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="112" y="169" width="68" height="14" rx="2"/>
  <circle class="badge" cx="122" cy="176" r="6"/>
  <text class="badget" x="122" y="179" text-anchor="middle">1</text>
  <text class="lbl" x="134" y="179">TYPES</text>

  <rect class="mask" x="312" y="201" width="68" height="14" rx="2"/>
  <circle class="badge" cx="322" cy="208" r="6"/>
  <text class="badget" x="322" y="211" text-anchor="middle">2</text>
  <text class="lbl" x="334" y="211">BUILDS</text>

  <rect class="mask" x="408" y="233" width="76" height="14" rx="2"/>
  <circle class="badge" cx="418" cy="240" r="6"/>
  <text class="badget" x="418" y="243" text-anchor="middle">3</text>
  <text class="lbl" x="430" y="243">RETURNS</text>

  <rect class="mask" x="112" y="305" width="80" height="14" rx="2"/>
  <circle class="badge" cx="122" cy="312" r="6"/>
  <text class="badget" x="122" y="315" text-anchor="middle">4</text>
  <text class="lbl" x="134" y="315">SUBMITS</text>

  <rect class="mask" x="312" y="337" width="84" height="14" rx="2"/>
  <circle class="badge" cx="322" cy="344" r="6"/>
  <text class="badget" x="322" y="347" text-anchor="middle">5</text>
  <text class="lbl" x="334" y="347">CONVERTS</text>

  <rect class="mask" x="512" y="369" width="96" height="14" rx="2"/>
  <circle class="badge" cx="522" cy="376" r="6"/>
  <text class="badget" x="522" y="379" text-anchor="middle">6</text>
  <text class="lbl" x="534" y="379">DISPATCHES</text>

  <rect class="mask" x="808" y="401" width="76" height="14" rx="2"/>
  <circle class="badge" cx="818" cy="408" r="6"/>
  <text class="badget" x="818" y="411" text-anchor="middle">7</text>
  <text class="lbl" x="830" y="411">REJECTS</text>

  <rect class="mask" x="608" y="433" width="76" height="14" rx="2"/>
  <circle class="badge" cx="618" cy="440" r="6"/>
  <text class="badget" x="618" y="443" text-anchor="middle">8</text>
  <text class="lbl" x="630" y="443">RETURNS</text>

  <rect class="mask" x="312" y="465" width="56" height="14" rx="2"/>
  <circle class="badge" cx="322" cy="472" r="6"/>
  <text class="badget" x="322" y="475" text-anchor="middle">9</text>
  <text class="lbl" x="334" y="475">PUTS</text>

  <rect class="mask" x="208" y="521" width="72" height="14" rx="2"/>
  <circle class="badge" cx="220" cy="528" r="7"/>
  <text class="badget" x="220" y="531" text-anchor="middle">10</text>
  <text class="lbl" x="232" y="531">SHOWS</text>

  <!-- The person -->
  <rect class="knock" x="36" y="64" width="128" height="56" rx="6"/>
  <rect id="form-refusal-person" class="n-ext" x="36" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="100" y="88" text-anchor="middle">Person</text>
  <text class="sub" x="100" y="106" text-anchor="middle">in the browser</text>

  <!-- The page -->
  <rect class="knock" x="224" y="64" width="152" height="56" rx="6"/>
  <rect id="form-refusal-page" class="n-back" x="224" y="64" width="152" height="56" rx="6"/>
  <text class="name" x="300" y="88" text-anchor="middle">Page</text>
  <text class="sub" x="300" y="106" text-anchor="middle">your LiveView</text>

  <!-- The form -->
  <rect class="knock" x="424" y="64" width="152" height="56" rx="6"/>
  <rect id="form-refusal-form" class="n-focal" x="424" y="64" width="152" height="56" rx="6"/>
  <text class="name" x="500" y="88" text-anchor="middle">Form</text>
  <text class="sub" x="500" y="106" text-anchor="middle">EhOsContract.Form</text>

  <!-- Dispatch -->
  <rect class="knock" x="624" y="64" width="152" height="56" rx="6"/>
  <rect id="form-refusal-dispatch" class="n-shared" x="624" y="64" width="152" height="56" rx="6"/>
  <text class="name" x="700" y="88" text-anchor="middle">Dispatch</text>
  <text class="sub" x="700" y="106" text-anchor="middle">EhOsContract.dispatch/3</text>

  <!-- The implementation -->
  <rect class="knock" x="824" y="64" width="152" height="56" rx="6"/>
  <rect id="form-refusal-implementation" class="n-back" x="824" y="64" width="152" height="56" rx="6"/>
  <text class="name" x="900" y="88" text-anchor="middle">Implementation</text>
  <text class="sub" x="900" y="106" text-anchor="middle">your module</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="600" x2="960" y2="600"/>
  <text class="eyes" x="40" y="620">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="640" r="6"/>
  <text class="badget" x="46" y="643" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="644">The person types in the form.</text>
  <circle class="badge" cx="46" cy="664" r="6"/>
  <text class="badget" x="46" y="667" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="668">The page builds the changeset.</text>
  <circle class="badge" cx="46" cy="688" r="6"/>
  <text class="badget" x="46" y="691" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="692">The changeset returns the errors of the shape.</text>
  <circle class="badge" cx="46" cy="712" r="6"/>
  <text class="badget" x="46" y="715" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="716">The person submits the form.</text>
  <circle class="badge" cx="46" cy="736" r="6"/>
  <text class="badget" x="46" y="739" text-anchor="middle">5</text>
  <text class="keyt" x="60" y="740">to_struct/1 converts the changeset into the command.</text>

  <circle class="badge" cx="526" cy="640" r="6"/>
  <text class="badget" x="526" y="643" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="644">The page dispatches the command.</text>
  <circle class="badge" cx="526" cy="664" r="6"/>
  <text class="badget" x="526" y="667" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="668">The implementation rejects it on an invariant of the unit.</text>
  <circle class="badge" cx="526" cy="688" r="6"/>
  <text class="badget" x="526" y="691" text-anchor="middle">8</text>
  <text class="keyt" x="540" y="692">Dispatch returns the refusal to the page.</text>
  <circle class="badge" cx="526" cy="712" r="6"/>
  <text class="badget" x="526" y="715" text-anchor="middle">9</text>
  <text class="keyt" x="540" y="716">refused/3 puts the reason on the changeset.</text>
  <circle class="badge" cx="526" cy="736" r="7"/>
  <text class="badget" x="526" y="739" text-anchor="middle">10</text>
  <text class="keyt" x="540" y="740">The page shows the error, in its own words.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="772" x2="960" y2="772"/>
  <rect class="n-focal" x="40" y="788" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="797">The form of the engine</text>
  <rect class="n-shared" x="230" y="788" width="14" height="10" rx="2"/>
  <text class="legt" x="250" y="797">The engine</text>
  <rect class="n-back" x="360" y="788" width="14" height="10" rx="2"/>
  <text class="legt" x="380" y="797">Code of your application</text>
  <rect class="n-ext" x="570" y="788" width="14" height="10" rx="2"/>
  <text class="legt" x="590" y="797">A person</text>
  <line class="arr" x1="700" y1="793" x2="727" y2="793" marker-end="url(#form-refusal-arrow)"/>
  <text class="legt" x="736" y="797">A call or an answer, in order</text>
  </g>
</svg>
