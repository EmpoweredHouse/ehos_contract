<!-- title: What occurs, in order, from a publication to the policy's command? -->
<!-- desc: The relay of the publisher hands each event to the bus, and the inbox of the subscriber runs the policy in one transaction before it acknowledges the message. -->
<!-- words: log, relay, bus, inbox, policy, dispatch -->
<!-- technical: -->
<!-- verbs: reads, hands, confirms, delivers, runs, issues, acknowledges -->
<!-- parts: log = -, relay = -, bus = -, inbox = -, policy = -, dispatch = - -->
<svg viewBox="0 0 1000 744" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="publication-to-policy-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- The transaction of the inbox, in the subscriber -->
  <rect class="zone" x="520" y="332" width="440" height="100" rx="8"/>
  <rect class="mask" x="536" y="326" width="124" height="12" rx="2"/>
  <text class="zlabel" x="540" y="335">ONE TRANSACTION</text>

  <!-- Lifelines -->
  <line class="rule" x1="100" y1="120" x2="100" y2="508"/>
  <line class="rule" x1="260" y1="120" x2="260" y2="508"/>
  <line class="rule" x1="420" y1="120" x2="420" y2="508"/>
  <line class="rule" x1="580" y1="120" x2="580" y2="508"/>
  <line class="rule" x1="740" y1="120" x2="740" y2="508"/>
  <line class="rule" x1="900" y1="120" x2="900" y2="508"/>

  <!-- Messages, top to bottom -->
  <line class="arr" x1="260" y1="168" x2="101" y2="168" marker-end="url(#publication-to-policy-arrow)"/>
  <line class="arr" x1="260" y1="208" x2="419" y2="208" marker-end="url(#publication-to-policy-arrow)"/>
  <line class="arr" x1="420" y1="248" x2="261" y2="248" marker-end="url(#publication-to-policy-arrow)"/>
  <line class="uses" x1="420" y1="296" x2="579" y2="296" marker-end="url(#publication-to-policy-arrow)"/>
  <line class="arr" x1="580" y1="368" x2="739" y2="368" marker-end="url(#publication-to-policy-arrow)"/>
  <line class="arr" x1="740" y1="408" x2="899" y2="408" marker-end="url(#publication-to-policy-arrow)"/>
  <line class="arr" x1="580" y1="468" x2="421" y2="468" marker-end="url(#publication-to-policy-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="112" y="146" width="64" height="14" rx="2"/>
  <circle class="badge" cx="122" cy="153" r="6"/>
  <text class="badget" x="122" y="156" text-anchor="middle">1</text>
  <text class="lbl" x="134" y="156">READS</text>

  <rect class="mask" x="272" y="186" width="68" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="193" r="6"/>
  <text class="badget" x="282" y="196" text-anchor="middle">2</text>
  <text class="lbl" x="294" y="196">HANDS</text>

  <rect class="mask" x="272" y="226" width="88" height="14" rx="2"/>
  <circle class="badge" cx="282" cy="233" r="6"/>
  <text class="badget" x="282" y="236" text-anchor="middle">3</text>
  <text class="lbl" x="294" y="236">CONFIRMS</text>

  <rect class="mask" x="432" y="274" width="88" height="14" rx="2"/>
  <circle class="badge" cx="442" cy="281" r="6"/>
  <text class="badget" x="442" y="284" text-anchor="middle">4</text>
  <text class="lbl" x="454" y="284">DELIVERS</text>

  <rect class="mask" x="592" y="346" width="56" height="14" rx="2"/>
  <circle class="badge" cx="602" cy="353" r="6"/>
  <text class="badget" x="602" y="356" text-anchor="middle">5</text>
  <text class="lbl" x="614" y="356">RUNS</text>

  <rect class="mask" x="752" y="386" width="68" height="14" rx="2"/>
  <circle class="badge" cx="762" cy="393" r="6"/>
  <text class="badget" x="762" y="396" text-anchor="middle">6</text>
  <text class="lbl" x="774" y="396">ISSUES</text>

  <rect class="mask" x="432" y="446" width="124" height="14" rx="2"/>
  <circle class="badge" cx="442" cy="453" r="6"/>
  <text class="badget" x="442" y="456" text-anchor="middle">7</text>
  <text class="lbl" x="454" y="456">ACKNOWLEDGES</text>

  <!-- The log of the publisher -->
  <rect class="knock" x="36" y="64" width="128" height="56" rx="6"/>
  <rect id="publication-to-policy-log" class="n-store" x="36" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="100" y="88" text-anchor="middle">Log</text>
  <text class="sub" x="100" y="106" text-anchor="middle">of the publisher</text>

  <!-- The relay -->
  <rect class="knock" x="196" y="64" width="128" height="56" rx="6"/>
  <rect id="publication-to-policy-relay" class="n-back" x="196" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="260" y="88" text-anchor="middle">Relay</text>
  <text class="sub" x="260" y="106" text-anchor="middle">one for each publish</text>

  <!-- The bus -->
  <rect class="knock" x="356" y="64" width="128" height="56" rx="6"/>
  <rect id="publication-to-policy-bus" class="n-ext" x="356" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="420" y="88" text-anchor="middle">Bus</text>
  <text class="sub" x="420" y="106" text-anchor="middle">the transport</text>

  <!-- The inbox -->
  <rect class="knock" x="516" y="64" width="128" height="56" rx="6"/>
  <rect id="publication-to-policy-inbox" class="n-focal" x="516" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="580" y="88" text-anchor="middle">Inbox</text>
  <text class="sub" x="580" y="106" text-anchor="middle">of the subscriber</text>

  <!-- The policy -->
  <rect class="knock" x="676" y="64" width="128" height="56" rx="6"/>
  <rect id="publication-to-policy-policy" class="n-back" x="676" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="740" y="88" text-anchor="middle">Policy</text>
  <text class="sub" x="740" y="106" text-anchor="middle">your module</text>

  <!-- Dispatch -->
  <rect class="knock" x="836" y="64" width="128" height="56" rx="6"/>
  <rect id="publication-to-policy-dispatch" class="n-back" x="836" y="64" width="128" height="56" rx="6"/>
  <text class="name" x="900" y="88" text-anchor="middle">Dispatch</text>
  <text class="sub" x="900" y="106" text-anchor="middle">of the subscriber</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="540" x2="960" y2="540"/>
  <text class="eyes" x="40" y="560">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="580" r="6"/>
  <text class="badget" x="46" y="583" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="584">After the commit, the relay reads the published events.</text>
  <circle class="badge" cx="46" cy="604" r="6"/>
  <text class="badget" x="46" y="607" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="608">The relay hands a batch of messages to the bus.</text>
  <circle class="badge" cx="46" cy="628" r="6"/>
  <text class="badget" x="46" y="631" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="632">The bus confirms the batch. Then the relay moves on.</text>
  <circle class="badge" cx="46" cy="652" r="6"/>
  <text class="badget" x="46" y="655" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="656">Later, the bus delivers each message to the inbox.</text>

  <circle class="badge" cx="526" cy="580" r="6"/>
  <text class="badget" x="526" y="583" text-anchor="middle">5</text>
  <text class="keyt" x="540" y="584">The inbox writes its row and runs each policy.</text>
  <circle class="badge" cx="526" cy="604" r="6"/>
  <text class="badget" x="526" y="607" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="608">The policy issues its commands to dispatch.</text>
  <circle class="badge" cx="526" cy="628" r="6"/>
  <text class="badget" x="526" y="631" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="632">After the commit, the inbox acknowledges the message.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="700" x2="960" y2="700"/>
  <rect class="n-focal" x="40" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="725">The subject</text>
  <rect class="n-back" x="150" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="170" y="725">The engine, or your module</text>
  <rect class="n-store" x="350" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="370" y="725">Kept by the engine</text>
  <rect class="n-ext" x="500" y="716" width="14" height="10" rx="2"/>
  <text class="legt" x="520" y="725">Outside the application</text>
  <line class="arr" x1="680" y1="721" x2="707" y2="721" marker-end="url(#publication-to-policy-arrow)"/>
  <text class="legt" x="716" y="725">A call</text>
  <line class="uses" x1="780" y1="721" x2="807" y2="721" marker-end="url(#publication-to-policy-arrow)"/>
  <text class="legt" x="816" y="725">Asynchronous</text>
  </g>
</svg>
