<!-- title: How does a person sign in? -->
<!-- desc: The application sends the browser to EHOS, the person signs in there, the application exchanges the code for tokens and keeps them encrypted in its database, and renews the credential through EHOS while the session lasts. -->
<!-- words: application, credential -->
<!-- technical: Browser, EHOS, Database -->
<!-- verbs: opens, redirects, signs in, sends, exchanges, issues, writes, renews -->
<!-- parts: browser = -, ehos = -, application = -, database = - -->
<svg viewBox="0 0 1000 916" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="sign-in-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Lifelines -->
  <line class="rule" x1="120" y1="120" x2="120" y2="640"/>
  <line class="rule" x1="373" y1="120" x2="373" y2="640"/>
  <line class="rule" x1="627" y1="120" x2="627" y2="640"/>
  <line class="rule" x1="880" y1="120" x2="880" y2="640"/>

  <!-- Messages, top to bottom -->
  <line class="arr" x1="120" y1="168" x2="626" y2="168" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="627" y1="212" x2="121" y2="212" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="120" y1="256" x2="372" y2="256" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="373" y1="300" x2="121" y2="300" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="120" y1="344" x2="626" y2="344" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="627" y1="388" x2="374" y2="388" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="373" y1="432" x2="626" y2="432" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="627" y1="476" x2="879" y2="476" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="627" y1="520" x2="121" y2="520" marker-end="url(#sign-in-arrow)"/>
  <line class="arr" x1="120" y1="564" x2="626" y2="564" marker-end="url(#sign-in-arrow)"/>
  <line class="uses" x1="627" y1="608" x2="374" y2="608" marker-end="url(#sign-in-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="132" y="146" width="64" height="14" rx="2"/>
  <circle class="badge" cx="142" cy="153" r="6"/>
  <text class="badget" x="142" y="156" text-anchor="middle">1</text>
  <text class="lbl" x="154" y="156">OPENS</text>

  <rect class="mask" x="132" y="190" width="96" height="14" rx="2"/>
  <circle class="badge" cx="142" cy="197" r="6"/>
  <text class="badget" x="142" y="200" text-anchor="middle">2</text>
  <text class="lbl" x="154" y="200">REDIRECTS</text>

  <rect class="mask" x="132" y="234" width="88" height="14" rx="2"/>
  <circle class="badge" cx="142" cy="241" r="6"/>
  <text class="badget" x="142" y="244" text-anchor="middle">3</text>
  <text class="lbl" x="154" y="244">SIGNS IN</text>

  <rect class="mask" x="132" y="278" width="96" height="14" rx="2"/>
  <circle class="badge" cx="142" cy="285" r="6"/>
  <text class="badget" x="142" y="288" text-anchor="middle">4</text>
  <text class="lbl" x="154" y="288">REDIRECTS</text>

  <rect class="mask" x="132" y="322" width="64" height="14" rx="2"/>
  <circle class="badge" cx="142" cy="329" r="6"/>
  <text class="badget" x="142" y="332" text-anchor="middle">5</text>
  <text class="lbl" x="154" y="332">SENDS</text>

  <rect class="mask" x="385" y="366" width="96" height="14" rx="2"/>
  <circle class="badge" cx="395" cy="373" r="6"/>
  <text class="badget" x="395" y="376" text-anchor="middle">6</text>
  <text class="lbl" x="407" y="376">EXCHANGES</text>

  <rect class="mask" x="385" y="410" width="72" height="14" rx="2"/>
  <circle class="badge" cx="395" cy="417" r="6"/>
  <text class="badget" x="395" y="420" text-anchor="middle">7</text>
  <text class="lbl" x="407" y="420">ISSUES</text>

  <rect class="mask" x="639" y="454" width="72" height="14" rx="2"/>
  <circle class="badge" cx="649" cy="461" r="6"/>
  <text class="badget" x="649" y="464" text-anchor="middle">8</text>
  <text class="lbl" x="661" y="464">WRITES</text>

  <rect class="mask" x="132" y="498" width="96" height="14" rx="2"/>
  <circle class="badge" cx="142" cy="505" r="6"/>
  <text class="badget" x="142" y="508" text-anchor="middle">9</text>
  <text class="lbl" x="154" y="508">REDIRECTS</text>

  <rect class="mask" x="132" y="542" width="64" height="14" rx="2"/>
  <circle class="badge" cx="142" cy="549" r="6"/>
  <text class="badget" x="142" y="552" text-anchor="middle">10</text>
  <text class="lbl" x="154" y="552">OPENS</text>

  <rect class="mask" x="385" y="586" width="72" height="14" rx="2"/>
  <circle class="badge" cx="395" cy="593" r="6"/>
  <text class="badget" x="395" y="596" text-anchor="middle">11</text>
  <text class="lbl" x="407" y="596">RENEWS</text>

  <rect class="knock" x="40" y="64" width="160" height="56" rx="6"/>
  <rect id="sign-in-browser" class="n-ext" x="40" y="64" width="160" height="56" rx="6"/>
  <text class="name" x="120" y="88" text-anchor="middle">Browser</text>
  <text class="sub" x="120" y="106" text-anchor="middle">of the person</text>

  <rect class="knock" x="293" y="64" width="160" height="56" rx="6"/>
  <rect id="sign-in-ehos" class="n-ext" x="293" y="64" width="160" height="56" rx="6"/>
  <text class="name" x="373" y="88" text-anchor="middle">EHOS</text>
  <text class="sub" x="373" y="106" text-anchor="middle">the platform</text>

  <rect class="knock" x="547" y="64" width="160" height="56" rx="6"/>
  <rect id="sign-in-application" class="n-focal" x="547" y="64" width="160" height="56" rx="6"/>
  <text class="name" x="627" y="88" text-anchor="middle">Application</text>
  <text class="sub" x="627" y="106" text-anchor="middle">with this package</text>

  <rect class="knock" x="800" y="64" width="160" height="56" rx="6"/>
  <rect id="sign-in-database" class="n-store" x="800" y="64" width="160" height="56" rx="6"/>
  <text class="name" x="880" y="88" text-anchor="middle">Database</text>
  <text class="sub" x="880" y="106" text-anchor="middle">of the application</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="672" x2="960" y2="672"/>
  <text class="eyes" x="40" y="692">HOW TO READ IT</text>
  <circle class="badge" cx="46" cy="712" r="6"/>
  <text class="badget" x="46" y="715" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="716">The person opens a page that needs a session.</text>
  <circle class="badge" cx="46" cy="736" r="6"/>
  <text class="badget" x="46" y="739" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="740">The application redirects the browser to the sign-in of EHOS.</text>
  <circle class="badge" cx="46" cy="760" r="6"/>
  <text class="badget" x="46" y="763" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="764">The person signs in at EHOS.</text>
  <circle class="badge" cx="46" cy="784" r="6"/>
  <text class="badget" x="46" y="787" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="788">EHOS redirects the browser to the callback, with a code.</text>
  <circle class="badge" cx="46" cy="808" r="6"/>
  <text class="badget" x="46" y="811" text-anchor="middle">5</text>
  <text class="keyt" x="60" y="812">The browser sends the code to the callback of the application.</text>
  <circle class="badge" cx="46" cy="832" r="6"/>
  <text class="badget" x="46" y="835" text-anchor="middle">6</text>
  <text class="keyt" x="60" y="836">The application exchanges the code, signed with its client key.</text>
  <circle class="badge" cx="526" cy="712" r="6"/>
  <text class="badget" x="526" y="715" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="716">EHOS issues an ID token, a refresh token and a credential.</text>
  <circle class="badge" cx="526" cy="736" r="6"/>
  <text class="badget" x="526" y="739" text-anchor="middle">8</text>
  <text class="keyt" x="540" y="740">The application writes the session, with each token encrypted.</text>
  <circle class="badge" cx="526" cy="760" r="6"/>
  <text class="badget" x="526" y="763" text-anchor="middle">9</text>
  <text class="keyt" x="540" y="764">The application redirects the browser back to the page.</text>
  <circle class="badge" cx="526" cy="784" r="6"/>
  <text class="badget" x="526" y="787" text-anchor="middle">10</text>
  <text class="keyt" x="540" y="788">The browser opens the next page with the session cookie.</text>
  <circle class="badge" cx="526" cy="808" r="6"/>
  <text class="badget" x="526" y="811" text-anchor="middle">11</text>
  <text class="keyt" x="540" y="812">Near expiry, the application renews the credential through EHOS.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="872" x2="960" y2="872"/>
  <rect class="n-focal" x="40" y="888" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="897">The application</text>
  <rect class="n-ext" x="180" y="888" width="14" height="10" rx="2"/>
  <text class="legt" x="200" y="897">Outside the application</text>
  <rect class="n-store" x="380" y="888" width="14" height="10" rx="2"/>
  <text class="legt" x="400" y="897">Kept by the application</text>
  <line class="arr" x1="600" y1="893" x2="627" y2="893" marker-end="url(#sign-in-arrow)"/>
  <text class="legt" x="636" y="897">A request</text>
  <line class="uses" x1="740" y1="893" x2="767" y2="893" marker-end="url(#sign-in-arrow)"/>
  <text class="legt" x="776" y="897">Only when needed</text>
  </g>
</svg>
