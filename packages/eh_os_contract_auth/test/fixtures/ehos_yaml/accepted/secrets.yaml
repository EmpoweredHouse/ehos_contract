# A workload that seeds its database in an ephemeral environment and is given secrets, one of
# them pinned to a version (eh-os D-98, D-99).
schema: ehos.yaml/v4
needs:
  database:
    engine: postgres
    migrate: ["/app/bin/migrate"]
    seed: ["/app/bin/seed"]
  people: read
  secrets:
    - name: smtp_password
    - name: gus_api_key
      version: 2
serves:
  - name: web
    port: 4000
    public: true
sign_in: {}
health:
  port: 4001
  ready: /health/ready
  live: /health/live
