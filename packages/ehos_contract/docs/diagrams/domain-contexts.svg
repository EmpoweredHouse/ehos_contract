<!-- title: Which context depends on which? -->
<!-- desc: Loans depends on the catalogue, because a loan names a copy that the catalogue owns; library events and loans go separate ways. -->
<!-- words: context, entity -->
<!-- technical: Catalogue, Loans, Library events, Copy -->
<!-- verbs: depends on, owns, names -->
<!-- parts: catalogue = -, loans = -, events = -, copy = - -->
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="domain-contexts-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Upstream above, downstream below -->
  <rect class="mask" x="36" y="66" width="84" height="12" rx="2"/>
  <text class="zlabel" x="40" y="75">UPSTREAM</text>
  <rect class="mask" x="36" y="258" width="104" height="12" rx="2"/>
  <text class="zlabel" x="40" y="267">DOWNSTREAM</text>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="250" y1="264" x2="250" y2="137" marker-end="url(#domain-contexts-arrow)"/>
  <line class="arr" x1="360" y1="104" x2="639" y2="104" marker-end="url(#domain-contexts-arrow)"/>
  <polyline class="arr" points="330,264 330,200 750,200 750,137" marker-end="url(#domain-contexts-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="262" y="152" width="100" height="14" rx="2"/>
  <circle class="badge" cx="272" cy="159" r="6"/>
  <text class="badget" x="272" y="162" text-anchor="middle">1</text>
  <text class="lbl" x="284" y="162">DEPENDS ON</text>

  <rect class="mask" x="464" y="97" width="56" height="14" rx="2"/>
  <circle class="badge" cx="474" cy="104" r="6"/>
  <text class="badget" x="474" y="107" text-anchor="middle">2</text>
  <text class="lbl" x="486" y="107">OWNS</text>

  <rect class="mask" x="508" y="193" width="64" height="14" rx="2"/>
  <circle class="badge" cx="518" cy="200" r="6"/>
  <text class="badget" x="518" y="203" text-anchor="middle">3</text>
  <text class="lbl" x="530" y="203">NAMES</text>

  <!-- The catalogue -->
  <rect class="knock" x="140" y="72" width="220" height="64" rx="6"/>
  <rect id="domain-contexts-catalogue" class="n-back" x="140" y="72" width="220" height="64" rx="6"/>
  <text class="name" x="250" y="98" text-anchor="middle">Catalogue</text>
  <text class="sub" x="250" y="116" text-anchor="middle">context :catalogue</text>

  <!-- The copy -->
  <rect class="knock" x="640" y="72" width="220" height="64" rx="6"/>
  <rect id="domain-contexts-copy" class="n-store" x="640" y="72" width="220" height="64" rx="6"/>
  <text class="name" x="750" y="98" text-anchor="middle">Copy</text>
  <text class="sub" x="750" y="116" text-anchor="middle">entity :copy</text>

  <!-- The loans -->
  <rect class="knock" x="140" y="264" width="220" height="64" rx="6"/>
  <rect id="domain-contexts-loans" class="n-focal" x="140" y="264" width="220" height="64" rx="6"/>
  <text class="name" x="250" y="290" text-anchor="middle">Loans</text>
  <text class="sub" x="250" y="308" text-anchor="middle">context :loans</text>

  <!-- The library events -->
  <rect class="knock" x="640" y="264" width="220" height="64" rx="6"/>
  <rect id="domain-contexts-events" class="n-back" x="640" y="264" width="220" height="64" rx="6"/>
  <text class="name" x="750" y="290" text-anchor="middle">Library events</text>
  <text class="sub" x="750" y="308" text-anchor="middle">separate ways from :loans</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="368" x2="960" y2="368"/>
  <text class="eyes" x="40" y="388">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="408" r="6"/>
  <text class="badget" x="46" y="411" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="412">Loans depends on the catalogue: a customer–supplier relation.</text>
  <circle class="badge" cx="46" cy="432" r="6"/>
  <text class="badget" x="46" y="435" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="436">The catalogue owns the entity copy.</text>
  <circle class="badge" cx="46" cy="456" r="6"/>
  <text class="badget" x="46" y="459" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="460">A field of the loans contract names a copy.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="500" x2="960" y2="500"/>
  <rect class="n-focal" x="40" y="516" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="525">The context that this example is about</text>
  <rect class="n-back" x="350" y="516" width="14" height="10" rx="2"/>
  <text class="legt" x="370" y="525">Another context</text>
  <rect class="n-store" x="520" y="516" width="14" height="10" rx="2"/>
  <text class="legt" x="540" y="525">An entity</text>
  <line class="arr" x1="660" y1="521" x2="687" y2="521" marker-end="url(#domain-contexts-arrow)"/>
  <text class="legt" x="696" y="525">Depends on, owns or names</text>
  </g>
</svg>
