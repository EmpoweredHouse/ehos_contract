<!-- title: Where does each consumer run, and what does a failure leave? -->
<!-- desc: A consumer delivered in the transaction fails the command with it; a subscription or an Oban job runs after the commit, and its failure leaves the event in the log. -->
<!-- words: dispatch, consumer, command, log, subscription, effect -->
<!-- technical: -->
<!-- verbs: runs, fails, appends, reads, inserts -->
<!-- parts: dispatch = -, inline = -, command = -, log = -, subscription = -, failing = -, job = -, discarded = - -->
<svg viewBox="0 0 1000 730" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="reaction-delivery-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Lanes -->
  <rect class="zone" x="40" y="40" width="920" height="140" rx="8"/>
  <rect class="mask" x="660" y="34" width="176" height="12" rx="2"/>
  <text class="zlabel" x="664" y="43">IN THE TRANSACTION</text>

  <rect class="zone" x="40" y="200" width="920" height="140" rx="8"/>
  <rect class="mask" x="660" y="194" width="292" height="12" rx="2"/>
  <text class="zlabel" x="664" y="203">AFTER THE COMMIT: A SUBSCRIPTION</text>

  <rect class="zone" x="40" y="360" width="920" height="140" rx="8"/>
  <rect class="mask" x="660" y="354" width="268" height="12" rx="2"/>
  <text class="zlabel" x="664" y="363">AFTER THE COMMIT: AN OBAN JOB</text>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="300" y1="120" x2="399" y2="120" marker-end="url(#reaction-delivery-arrow)"/>
  <line class="arr" x1="600" y1="120" x2="699" y2="120" marker-end="url(#reaction-delivery-arrow)"/>
  <line class="arr" x1="200" y1="152" x2="200" y2="247" marker-end="url(#reaction-delivery-arrow)"/>
  <line class="uses" x1="300" y1="280" x2="399" y2="280" marker-end="url(#reaction-delivery-arrow)"/>
  <line class="arr" x1="600" y1="280" x2="699" y2="280" marker-end="url(#reaction-delivery-arrow)"/>
  <polyline class="arr" points="100,128 64,128 64,440 399,440" marker-end="url(#reaction-delivery-arrow)"/>
  <line class="arr" x1="600" y1="440" x2="699" y2="440" marker-end="url(#reaction-delivery-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="308" y="90" width="60" height="14" rx="2"/>
  <circle class="badge" cx="318" cy="97" r="6"/>
  <text class="badget" x="318" y="100" text-anchor="middle">1</text>
  <text class="lbl" x="330" y="100">runs</text>

  <rect class="mask" x="608" y="90" width="64" height="14" rx="2"/>
  <circle class="badge" cx="618" cy="97" r="6"/>
  <text class="badget" x="618" y="100" text-anchor="middle">2</text>
  <text class="lbl" x="630" y="100">fails</text>

  <rect class="mask" x="212" y="190" width="84" height="14" rx="2"/>
  <circle class="badge" cx="222" cy="197" r="6"/>
  <text class="badget" x="222" y="200" text-anchor="middle">3</text>
  <text class="lbl" x="234" y="200">appends</text>

  <rect class="mask" x="308" y="250" width="64" height="14" rx="2"/>
  <circle class="badge" cx="318" cy="257" r="6"/>
  <text class="badget" x="318" y="260" text-anchor="middle">4</text>
  <text class="lbl" x="330" y="260">reads</text>

  <rect class="mask" x="608" y="250" width="64" height="14" rx="2"/>
  <circle class="badge" cx="618" cy="257" r="6"/>
  <text class="badget" x="618" y="260" text-anchor="middle">5</text>
  <text class="lbl" x="630" y="260">fails</text>

  <rect class="mask" x="120" y="448" width="80" height="14" rx="2"/>
  <circle class="badge" cx="130" cy="455" r="6"/>
  <text class="badget" x="130" y="458" text-anchor="middle">6</text>
  <text class="lbl" x="142" y="458">inserts</text>

  <rect class="mask" x="608" y="410" width="64" height="14" rx="2"/>
  <circle class="badge" cx="618" cy="417" r="6"/>
  <text class="badget" x="618" y="420" text-anchor="middle">7</text>
  <text class="lbl" x="630" y="420">fails</text>

  <!-- Dispatch -->
  <rect class="knock" x="100" y="88" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-dispatch" class="n-back" x="100" y="88" width="200" height="64" rx="6"/>
  <text class="name" x="200" y="116" text-anchor="middle">Dispatch</text>
  <text class="sub" x="200" y="134" text-anchor="middle">appends the event</text>

  <!-- The consumers delivered in the transaction -->
  <rect class="knock" x="400" y="88" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-inline" class="n-back" x="400" y="88" width="200" height="64" rx="6"/>
  <text class="name" x="500" y="116" text-anchor="middle">Consumer</text>
  <text class="sub" x="500" y="134" text-anchor="middle">:in_transaction</text>

  <!-- The command that fails -->
  <rect class="knock" x="700" y="88" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-command" class="n-back" x="700" y="88" width="200" height="64" rx="6"/>
  <text class="name" x="800" y="116" text-anchor="middle">Command</text>
  <text class="sub" x="800" y="134" text-anchor="middle">fails, appends nothing</text>

  <!-- The log -->
  <rect class="knock" x="100" y="248" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-log" class="n-focal" x="100" y="248" width="200" height="64" rx="6"/>
  <text class="name" x="200" y="276" text-anchor="middle">Log</text>
  <text class="sub" x="200" y="294" text-anchor="middle">keeps the event</text>

  <!-- The subscription -->
  <rect class="knock" x="400" y="248" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-subscription" class="n-back" x="400" y="248" width="200" height="64" rx="6"/>
  <text class="name" x="500" y="276" text-anchor="middle">Subscription</text>
  <text class="sub" x="500" y="294" text-anchor="middle">reads in order</text>

  <!-- The subscription that stopped -->
  <rect class="knock" x="700" y="248" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-failing" class="n-back" x="700" y="248" width="200" height="64" rx="6"/>
  <text class="name" x="800" y="276" text-anchor="middle">Subscription</text>
  <text class="sub" x="800" y="294" text-anchor="middle">failing, stops there</text>

  <!-- The job of an effect -->
  <rect class="knock" x="400" y="408" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-job" class="n-back" x="400" y="408" width="200" height="64" rx="6"/>
  <text class="name" x="500" y="436" text-anchor="middle">Effect</text>
  <text class="sub" x="500" y="454" text-anchor="middle">a job in the queue :events</text>

  <!-- The job that Oban discards -->
  <rect class="knock" x="700" y="408" width="200" height="64" rx="6"/>
  <rect id="reaction-delivery-discarded" class="n-back" x="700" y="408" width="200" height="64" rx="6"/>
  <text class="name" x="800" y="436" text-anchor="middle">Effect</text>
  <text class="sub" x="800" y="454" text-anchor="middle">job discarded by Oban</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="532" x2="960" y2="532"/>
  <text class="eyes" x="40" y="552">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="572" r="6"/>
  <text class="badget" x="46" y="575" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="576">Before the commit, dispatch runs each consumer :in_transaction.</text>
  <circle class="badge" cx="46" cy="596" r="6"/>
  <text class="badget" x="46" y="599" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="600">If one fails, the command fails with it.</text>
  <circle class="badge" cx="46" cy="620" r="6"/>
  <text class="badget" x="46" y="623" text-anchor="middle">3</text>
  <text class="keyt" x="60" y="624">If none fails, dispatch commits. The log keeps the event.</text>
  <circle class="badge" cx="46" cy="644" r="6"/>
  <text class="badget" x="46" y="647" text-anchor="middle">4</text>
  <text class="keyt" x="60" y="648">A subscription reads the log in order.</text>

  <circle class="badge" cx="526" cy="572" r="6"/>
  <text class="badget" x="526" y="575" text-anchor="middle">5</text>
  <text class="keyt" x="540" y="576">After 3 attempts on one event, the subscription stops.</text>
  <circle class="badge" cx="526" cy="596" r="6"/>
  <text class="badget" x="526" y="599" text-anchor="middle">6</text>
  <text class="keyt" x="540" y="600">In the transaction, dispatch inserts a job for each effect :at_least_once.</text>
  <circle class="badge" cx="526" cy="620" r="6"/>
  <text class="badget" x="526" y="623" text-anchor="middle">7</text>
  <text class="keyt" x="540" y="624">After 3 attempts, Oban discards the job.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="676" x2="960" y2="676"/>
  <rect class="n-focal" x="40" y="692" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="701">What a failure leaves</text>
  <rect class="n-back" x="210" y="692" width="14" height="10" rx="2"/>
  <text class="legt" x="230" y="701">The engine, or your code</text>
  <line class="arr" x1="420" y1="697" x2="447" y2="697" marker-end="url(#reaction-delivery-arrow)"/>
  <text class="legt" x="456" y="701">In order</text>
  <line class="uses" x1="540" y1="697" x2="567" y2="697" marker-end="url(#reaction-delivery-arrow)"/>
  <text class="legt" x="576" y="701">After the commit</text>
  </g>
</svg>
