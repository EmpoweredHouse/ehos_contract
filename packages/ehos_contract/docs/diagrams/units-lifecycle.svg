<!-- title: Which statuses can an aggregate have, and which events move it? -->
<!-- desc: The event places_offered starts the workshop in Open; speaker_invited keeps it there; called_off moves it to Called off, where call_off is refused. -->
<!-- words: status, event, rejection, aggregate -->
<!-- technical: Open, Called off, places_offered, speaker_invited, called_off, call_off -->
<!-- verbs: starts, moves, refuses -->
<!-- parts: nostatus = -, open = -, closed = -, rejection = - -->
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="units-lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon class="head" points="0 0, 8 3, 0 6"/></marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- Connectors (behind the parts) -->
  <line class="arr" x1="240" y1="182" x2="399" y2="182" marker-end="url(#units-lifecycle-arrow)"/>
  <polyline class="arr" points="412,150 412,80 588,80 588,149" marker-end="url(#units-lifecycle-arrow)"/>
  <line class="arr" x1="600" y1="182" x2="759" y2="182" marker-end="url(#units-lifecycle-arrow)"/>
  <line class="arr" x1="850" y1="214" x2="850" y2="329" marker-end="url(#units-lifecycle-arrow)"/>

  <!-- Connector labels, numbered to match the key -->
  <rect class="mask" x="252" y="175" width="124" height="14" rx="2"/>
  <circle class="badge" cx="262" cy="182" r="6"/>
  <text class="badget" x="262" y="185" text-anchor="middle">1</text>
  <text class="lbl" x="274" y="185">places_offered</text>

  <rect class="mask" x="436" y="73" width="130" height="14" rx="2"/>
  <circle class="badge" cx="446" cy="80" r="6"/>
  <text class="badget" x="446" y="83" text-anchor="middle">2</text>
  <text class="lbl" x="458" y="83">speaker_invited</text>

  <rect class="mask" x="626" y="175" width="94" height="14" rx="2"/>
  <circle class="badge" cx="636" cy="182" r="6"/>
  <text class="badget" x="636" y="185" text-anchor="middle">3</text>
  <text class="lbl" x="648" y="185">called_off</text>

  <rect class="mask" x="862" y="265" width="80" height="14" rx="2"/>
  <circle class="badge" cx="872" cy="272" r="6"/>
  <text class="badget" x="872" y="275" text-anchor="middle">4</text>
  <text class="lbl" x="884" y="275">call_off</text>

  <!-- No status yet -->
  <rect class="knock" x="60" y="150" width="180" height="64" rx="6"/>
  <rect id="units-lifecycle-nostatus" class="n-back" x="60" y="150" width="180" height="64" rx="6"/>
  <text class="name" x="150" y="176" text-anchor="middle">No status</text>
  <text class="sub" x="150" y="194" text-anchor="middle">before the first event</text>

  <!-- Open -->
  <rect class="knock" x="400" y="150" width="200" height="64" rx="6"/>
  <rect id="units-lifecycle-open" class="n-focal" x="400" y="150" width="200" height="64" rx="6"/>
  <text class="name" x="500" y="176" text-anchor="middle">Open</text>
  <text class="sub" x="500" y="194" text-anchor="middle">status :open</text>

  <!-- Called off -->
  <rect class="knock" x="760" y="150" width="180" height="64" rx="6"/>
  <rect id="units-lifecycle-closed" class="n-back" x="760" y="150" width="180" height="64" rx="6"/>
  <text class="name" x="850" y="176" text-anchor="middle">Called off</text>
  <text class="sub" x="850" y="194" text-anchor="middle">status :closed, final</text>

  <!-- The rejection -->
  <rect class="knock" x="760" y="330" width="180" height="64" rx="6"/>
  <rect id="units-lifecycle-rejection" class="n-shared" x="760" y="330" width="180" height="64" rx="6"/>
  <text class="name" x="850" y="356" text-anchor="middle">Rejection</text>
  <text class="sub" x="850" y="374" text-anchor="middle">only_an_open_workshop</text>

  <!-- Key: the numbered connectors in words -->
  <g class="key">
  <line class="rule" x1="40" y1="424" x2="960" y2="424"/>
  <text class="eyes" x="40" y="444">HOW TO READ IT</text>

  <circle class="badge" cx="46" cy="464" r="6"/>
  <text class="badget" x="46" y="467" text-anchor="middle">1</text>
  <text class="keyt" x="60" y="468">places_offered starts the workshop in Open.</text>
  <circle class="badge" cx="46" cy="488" r="6"/>
  <text class="badget" x="46" y="491" text-anchor="middle">2</text>
  <text class="keyt" x="60" y="492">No transition names speaker_invited: the workshop stays Open.</text>

  <circle class="badge" cx="526" cy="464" r="6"/>
  <text class="badget" x="526" y="467" text-anchor="middle">3</text>
  <text class="keyt" x="540" y="468">called_off moves the workshop to Called off, a final status.</text>
  <circle class="badge" cx="526" cy="488" r="6"/>
  <text class="badget" x="526" y="491" text-anchor="middle">4</text>
  <text class="keyt" x="540" y="492">In Called off, dispatch refuses call_off.</text>
  </g>

  <!-- Legend strip -->
  <g class="legend">
  <line class="rule" x1="40" y1="516" x2="960" y2="516"/>
  <rect class="n-focal" x="40" y="532" width="14" height="10" rx="2"/>
  <text class="legt" x="60" y="541">The status in which the workshop decides</text>
  <rect class="n-back" x="300" y="532" width="14" height="10" rx="2"/>
  <text class="legt" x="320" y="541">Another status</text>
  <rect class="n-shared" x="440" y="532" width="14" height="10" rx="2"/>
  <text class="legt" x="460" y="541">What dispatch returns</text>
  <line class="arr" x1="620" y1="537" x2="647" y2="537" marker-end="url(#units-lifecycle-arrow)"/>
  <text class="legt" x="656" y="541">An event, or a command</text>
  </g>
</svg>
