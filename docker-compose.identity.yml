name: pns-identity-poc

# Not part of the gate. `docker compose up -d` (CLAUDE.md's gate command) never
# touches this file — it is started explicitly, only when working on the
# identity seam:
#
#   docker compose -f docker-compose.identity.yml up -d
#
# Zitadel is the "simplest start" candidate from docs/adr/identity-seam.md, run
# here to verify the PoC checklist in that document (Google Workspace / Entra ID
# brokering, email/password fallback, revoke-on-block behaviour) before any of
# it becomes the engine's active PNS.Auth.Verifier.

services:
  zitadel-db:
    image: postgres:17-alpine
    container_name: pns-identity-db
    environment:
      POSTGRES_USER: zitadel
      POSTGRES_PASSWORD: zitadel
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zitadel -d zitadel"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - zitadel_pgdata:/var/lib/postgresql/data

  zitadel:
    # Pinned to what "latest" resolved to on first pull (9 August), for repeatability.
    image: ghcr.io/zitadel/zitadel:v4.16.3
    container_name: pns-identity
    command: >
      start-from-init
      --masterkey "MasterkeyNeedsToHave32Characters"
      --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: "5432"
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_EXTERNALDOMAIN: localhost
      # Dev-only bootstrap login. Never reused past this PoC.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: Pns-identity-poc1
      # A machine user + PAT created on first boot, so the smoke test can call
      # the Management API to provision a project/application without a human
      # clicking through the console first. Written to a bind mount, gitignored.
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: automation
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: automation
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_PATPATH: /poc-out/admin.pat
      # A second machine user + PAT, this one for the login UI container to
      # call back into the API with — its own credential, not a reuse of the
      # admin one above, matching how Zitadel's own compose example splits it.
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2030-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /poc-out/login-client.pat
      # Skip the forced password change so the bootstrap admin can actually be
      # used to click through a login for this PoC without an extra screen.
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
    depends_on:
      zitadel-db:
        condition: service_healthy
    volumes:
      - ./tmp/identity-poc:/poc-out
    healthcheck:
      # `zitadel ready` disagrees with `/debug/healthz` (which answers 200 the
      # whole time — checked directly, 10 August) once FirstInstance also
      # bootstraps a login-client machine user; not chased further, and not
      # load-bearing for `depends_on` below, which does not gate on it.
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 3s
      timeout: 3s
      retries: 40

  # The login screens themselves: Zitadel 3+ ships these as a separate
  # deployable (docs/adr/identity-seam.md's 9 August finding — the core API
  # registers no `/ui/*` route at all), not something the core container
  # serves.
  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.16.3
    container_name: pns-identity-login
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: "Host:localhost:8080,X-Forwarded-Proto:http"
    volumes:
      - ./tmp/identity-poc:/zitadel/bootstrap:ro
    depends_on:
      zitadel:
        condition: service_started

  # Fronts both containers on one origin. The API redirects a browser to
  # `/ui/v2/login/...` on whatever host served the request, so the two only
  # work together behind a single port — see identity-poc-traefik-dynamic.yml.
  traefik:
    image: traefik:v3.1
    container_name: pns-identity-proxy
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:8080
    ports:
      - "8080:8080"
    volumes:
      - ./identity-poc-traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      zitadel:
        condition: service_started
      zitadel-login:
        condition: service_started

volumes:
  zitadel_pgdata:
