name: eh-os-contract-host

services:
  postgres:
    image: postgres:17-alpine
    container_name: eh-os-postgres
    environment:
      POSTGRES_USER: eh_os
      POSTGRES_PASSWORD: eh_os
      POSTGRES_DB: ehos_contract_host_dev
    ports:
      # 5433 on the host: 5432 is often taken by a local Postgres, and this has
      # to start on a clean machine without asking what else is listening.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eh_os -d ehos_contract_host_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
