name: pns-prototype

services:
  postgres:
    image: postgres:17-alpine
    container_name: pns-postgres
    environment:
      POSTGRES_USER: pns
      POSTGRES_PASSWORD: pns
      POSTGRES_DB: pns_prototype_dev
    ports:
      # 5433 na hoście: 5432 bywa zajęty lokalnym Postgresem, a to ma stać
      # na czystej maszynie bez pytania, co jeszcze słucha.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pns -d pns_prototype_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
