<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graph explorer mock-up</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@dagrejs/dagre@1.1.4/dist/dagre.min.js"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <div class="crumbs" id="crumbs"></div>
      <button class="leave" id="leave" hidden title="Leave (Escape)">✕ leave</button>
      <div class="switches" id="switches"></div>
    </header>
    <aside id="left"></aside>
    <main id="viewport">
      <div id="world"></div>
      <div class="banner" id="banner" hidden></div>
    </main>
    <aside id="panel" hidden></aside>
  </div>
  <div id="measure"></div>
  <script src="app.js"></script>
</body>
</html>
